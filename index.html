<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BASVAKALYAN MART</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ── PREMIUM ANIMATIONS & RESETS ── */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; }
    
    /* BACKGROUND ANIMATION */
    body { 
      background: linear-gradient(135deg, #f7f4f0 0%, #ffece0 50%, #f7f4f0 100%); 
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #1e1e1e; 
      padding-bottom: 100px; 
      overflow-x: hidden; 
    }
    @keyframes gradientBG { 
      0% { background-position: 0% 50%; } 
      50% { background-position: 100% 50%; } 
      100% { background-position: 0% 50%; } 
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    .animate-fade { animation: fadeIn 0.5s ease forwards; }

    /* ── PREMIUM HEADER ── */
    .header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 200; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04); border-bottom: 1px solid rgba(139, 69, 19, 0.08); }
    .brand h1 { font-size: 2.2rem; font-weight: 800; background: linear-gradient(145deg, #0056D2 0%, #003b8f 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1.1; }
    .brand .hotel-sub { font-size: 0.85rem; font-weight: 600; color: #0056D2; margin-top: 4px; display: flex; align-items: center; gap: 8px; }
    .brand .hotel-sub .badge { background: linear-gradient(145deg, #ff6a2b, #e0530e); color: #fff; font-size: 0.7rem; padding: 3px 10px; border-radius: 20px; font-weight: 700; box-shadow: 0 3px 8px rgba(224,83,14,0.3); }

    /* ── HOTEL TABS ── */
    .hotel-tabs-container { max-width: 1200px; margin: 15px auto 0; padding: 0 20px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
    .hotel-tabs-container::-webkit-scrollbar { display: none; }
    .hotel-tabs { display: flex; gap: 10px; padding-bottom: 5px; }
    .hotel-tab { background: #ffffff; color: #8b6b4d; border: 1.5px solid #ede6de; padding: 10px 20px; border-radius: 50px; font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
    .hotel-tab:hover { border-color: #dbbd9c; background: #fffaf6; transform: translateY(-2px); }
    .hotel-tab.active { background: linear-gradient(145deg, #0056D2, #003b8f); color: white; border-color: transparent; box-shadow: 0 6px 16px -4px rgba(0,86,210,0.4); transform: scale(1.05); }
    
    /* ── SEARCH ── */
    .search-container { max-width: 900px; margin: 15px auto 10px; padding: 0 20px; }
    .search-box { display: flex; align-items: center; background: rgba(255, 255, 255, 0.9); border: 1px solid #ede6de; border-radius: 60px; padding: 12px 22px; box-shadow: 0 4px 16px rgba(0,0,0,0.03); transition: all 0.3s; }
    .search-box:focus-within { box-shadow: 0 8px 24px rgba(0,86,210,0.15); border-color: #0056D2; transform: translateY(-2px); background: #fff; }
    .search-box input { border: none; outline: none; width: 100%; font-size: 1rem; margin-left: 12px; background: transparent; }

    /* ── MENU GRID & CARDS ── */
    .menu-container { max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 26px; }
    .card { background: #ffffff; border-radius: 28px; overflow: hidden; box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.06); display: flex; flex-direction: column; border: 1px solid #f3ede8; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); animation: popIn 0.5s ease forwards; }
    .card:hover { transform: translateY(-8px); box-shadow: 0 24px 48px -12px rgba(0,0,0,0.12); }
    .card-img-container { position: relative; width: 100%; height: 190px; background: #efe8e0; overflow: hidden; }
    .card-img-container img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .card:hover .card-img-container img { transform: scale(1.1); }
    
    /* Time Badge */
    .card-time-badge { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,.75); color: #fff; font-size: .75rem; font-weight: 700; padding: 6px 14px; border-radius: 20px; backdrop-filter: blur(6px); letter-spacing: 0.5px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .card-hotel-badge { position: absolute; top: 12px; left: 12px; background: rgba(255, 255, 255, 0.95); color: #0056D2; font-size: .7rem; font-weight: 800; padding: 5px 10px; border-radius: 20px; backdrop-filter: blur(6px); }
    
    .card-content { padding: 18px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { font-size: 1.2rem; font-weight: 700; color: #2c1d12; margin-bottom: 4px; }
    .card-price { font-size: 1.1rem; color: #0056D2; font-weight: 800; margin-bottom: 16px; }
    .card-price::before { content: "₹"; margin-right: 2px; }

    /* ── QUANTITY CONTROLS (ANIMATED) ── */
    .qty-container { display: flex; align-items: center; justify-content: space-between; background: #f0f5ff; border: 1px solid #d0e0ff; border-radius: 50px; padding: 5px; margin-top: auto; animation: popIn 0.3s ease; }
    .qty-btn { background: #ffffff; color: #0056D2; border: 1px solid #e0e0e0; width: 38px; height: 38px; border-radius: 50%; font-size: 1.3rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .qty-btn:hover { background: #0056D2; color: white; border-color: #0056D2; transform: scale(1.1); }
    .qty-btn:active { transform: scale(0.9); }
    .qty-num { font-weight: 800; font-size: 1.1rem; color: #0056D2; animation: popIn 0.2s ease; }

    .add-btn { margin-top: auto; background: linear-gradient(145deg, #0056D2 0%, #003b8f 100%); color: white; border: none; padding: 14px 10px; border-radius: 50px; font-weight: 800; cursor: pointer; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.3s; box-shadow: 0 8px 20px -4px rgba(0,86,210,0.45); }
    .add-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px -4px rgba(0,86,210,0.6); }
    .add-btn:active { transform: scale(0.95); }

    /* ── FLOATING CART BUTTON ── */
    .floating-cart { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #1e9e4a, #157a36); color: white; padding: 16px 24px; border-radius: 50px; display: flex; align-items: center; justify-content: space-between; width: calc(100% - 40px); max-width: 450px; box-shadow: 0 10px 30px rgba(30, 158, 74, 0.4); cursor: pointer; z-index: 500; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0; }
    .floating-cart.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .floating-cart:hover { transform: translateX(-50%) translateY(-5px); box-shadow: 0 15px 40px rgba(30, 158, 74, 0.6); }
    .cart-info { display: flex; flex-direction: column; }
    .cart-items-count { font-size: 0.8rem; font-weight: 500; opacity: 0.9; }
    .cart-total-price { font-size: 1.2rem; font-weight: 800; }
    .view-cart-text { font-weight: 700; font-size: 1rem; display: flex; align-items: center; gap: 5px; }

    /* ── MODALS ── */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(20, 15, 10, 0.7); z-index: 1000; justify-content: center; align-items: flex-end; backdrop-filter: blur(5px); }
    .modal.active { display: flex; animation: fadeIn 0.3s ease; }
    .modal-content { background: #ffffff; width: 100%; max-width: 600px; border-radius: 32px 32px 0 0; padding: 28px; max-height: 90vh; overflow-y: auto; animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; position: relative; }
    
    .drag-handle { width: 50px; height: 5px; background: #e0e0e0; border-radius: 10px; margin: 0 auto 20px auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid #f0e6de; padding-bottom: 14px; }
    .modal-header h2 { font-size: 1.4rem; font-weight: 800; color: #2c1d12; }
    .close-btn { background: #f5f5f5; border: none; font-size: 1.5rem; cursor: pointer; color: #555; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .close-btn:hover { background: #e0e0e0; transform: rotate(90deg); }
    
    .cart-item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px dashed #f0e6de; animation: slideUp 0.3s ease; }
    .cart-item-info { display: flex; flex-direction: column; }
    .cart-item-name { font-weight: 700; color: #333; font-size: 0.95rem; }
    .cart-item-price { color: #888; font-size: 0.85rem; }
    .cart-item-total { font-weight: 800; color: #0056D2; }

    .summary-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95rem; color: #5f4b3a; }
    .summary-row.total { font-weight: 800; font-size: 1.2rem; color: #2c1d12; border-top: 1px dashed #dbbd9c; padding-top: 12px; margin-top: 12px; }
    .delivery-badge { background: #e8f5e9; color: #1e7b3c; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; font-weight: 700; margin-left: 8px; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 700; font-size: 0.85rem; color: #5f4b3a; }
    .form-group input, .form-group textarea { width: 100%; padding: 14px; border: 1.5px solid #e2d8d0; border-radius: 18px; font-size: 0.95rem; transition: all 0.3s; background: #fafafa; }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #0056D2; background: #fff; box-shadow: 0 0 0 4px rgba(0,86,210,0.1); }
    .form-group textarea { resize: none; color: #777; }
    
    .payment-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
    .pay-label { display: flex; align-items: center; padding: 15px 18px; border: 1.5px solid #ede6de; border-radius: 18px; cursor: pointer; font-weight: 600; background: #fefcfb; transition: all 0.2s; gap: 10px; }
    .pay-label:has(input:checked) { border-color: #0056D2; background: #f0f5ff; box-shadow: 0 0 0 3px rgba(0,86,210,0.1); transform: scale(1.02); }
    .pay-label input { accent-color: #0056D2; width: 20px; height: 20px; }

    .qr-section { display: none; text-align: center; margin: 16px 0; padding: 20px; background: #fdf8f4; border-radius: 22px; border: 1px dashed #dbbd9c; animation: popIn 0.4s ease; }
    .qr-section img#qrImage { width: 180px; height: 180px; margin-top: 10px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    .app-pay-btn { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px; border: 1.5px solid #ede6de; border-radius: 18px; background: #fff; cursor: pointer; transition: all 0.2s; font-size: 1rem; font-weight: 700; color: #333; width: 100%; margin-top: 8px; }
    .app-pay-btn:hover { border-color: #0056D2; background: #f0f5ff; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .app-logo { height: 24px; width: auto; }

    .place-order-btn { width: 100%; background: linear-gradient(145deg, #1e9e4a 0%, #157a36 100%); color: white; padding: 18px; border: none; border-radius: 50px; font-size: 1.1rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.3s; box-shadow: 0 8px 24px -4px rgba(30,158,74,0.45); }
    .place-order-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 32px -4px rgba(30,158,74,0.6); }
    .place-order-btn:active { transform: scale(0.98); }

    #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #333; color: white; padding: 12px 24px; border-radius: 30px; font-weight: 600; font-size: 0.9rem; z-index: 2000; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* Empty State */
    .empty-state { text-align: center; padding: 50px 20px; color: #888; animation: fadeIn 0.5s ease; }
    .empty-state h2 { font-size: 1.5rem; color: #333; margin-bottom: 8px; }
  </style>
</head>
<body>

<div id="toast">Item added to cart!</div>

<div class="header">
  <div class="brand">
    <h1 id="hotelName">BASVAKALYAN MART</h1>
    <div class="hotel-sub">
      <span id="hotelSubtitle">Select a Hotel</span>
      <span class="badge" id="productCount">0 items</span>
    </div>
  </div>
</div>

<div class="hotel-tabs-container">
  <div class="hotel-tabs" id="hotelTabs"></div>
</div>

<div class="search-container">
  <div class="search-box">
    <span>🔍</span>
    <input type="text" id="searchInput" placeholder="Search Biryani, Dosa...">
  </div>
</div>

<div class="menu-container" id="menuGrid"></div>

<!-- FLOATING CART BUTTON -->
<div class="floating-cart" id="floatingCart" onclick="openCheckout()">
  <div class="cart-info">
    <span class="cart-items-count" id="cartItemsCount">0 Items</span>
    <span class="cart-total-price" id="cartTotalPrice">₹0</span>
  </div>
  <div class="view-cart-text">View Cart 🛒</div>
</div>

<!-- CHECKOUT MODAL -->
<div class="modal" id="checkoutModal">
  <div class="modal-content">
    <div class="drag-handle" onclick="closeModal()"></div>
    
    <div class="modal-header">
      <h2>Your Cart</h2>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>

    <div id="cartItemsList" style="margin-bottom: 20px;"></div>

    <div style="background:#fdf8f4; padding:16px; border-radius:20px; margin-bottom:22px;">
      <div class="summary-row">
        <span>Item Total</span>
        <span id="billItemTotal">₹0</span>
      </div>
      <div class="summary-row">
        <span>Delivery Charge <span class="delivery-badge">BASVAKALYAN</span></span>
        <span id="billDelivery">₹10</span>
      </div>
      <div class="summary-row total">
        <span>To Pay</span>
        <span id="billGrandTotal">₹10</span>
      </div>
    </div>

    <form id="checkoutForm" onsubmit="placeOrder(event)">
      <div class="form-group">
        <label>Your Name</label>
        <input type="text" id="custName" required placeholder="Full name">
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="custPhone" required placeholder="10-digit mobile" pattern="[0-9]{10}">
      </div>
      
      <div class="form-group">
        <label>📍 Delivery Location (Auto-Detecting...)</label>
        <textarea id="custAddress" readonly required rows="2" placeholder="Location fetch ho rahi hai...">Detecting...</textarea>
        <p style="font-size:0.75rem; color:#e0530e; margin-top:4px; font-weight:600;" id="locStatus">Allow GPS access to place order.</p>
      </div>

      <label style="font-weight: 800; margin-bottom: 10px; display: block;">Payment Method</label>
      <div class="payment-options">
        <label class="pay-label" onclick="toggleQR(true)">
          <input type="radio" name="payment" value="UPI" checked>
          📱 Online Payment (UPI)
        </label>
        <label class="pay-label" onclick="toggleQR(false)">
          <input type="radio" name="payment" value="COD">
          💵 Cash on Delivery
        </label>
      </div>

      <div class="qr-section" id="qrSection">
        <p style="font-weight:700;">Scan QR to Pay</p>
        <img id="qrImage" src="" alt="UPI QR">
        <p style="margin-top:10px; font-size:0.8rem; color:#777;">UPI ID: <b id="upiIdDisplay">9353481235@axl</b></p>
        
        <div class="payment-options" style="margin-top: 15px;">
          <button type="button" class="app-pay-btn" onclick="payWithApp('phonepe')">
            <img src="https://upload.wikimedia.org/wikipedia/commons/7/71/PhonePe_Logo.svg" class="app-logo"> PhonePe
          </button>
          <button type="button" class="app-pay-btn" onclick="payWithApp('paytm')">
            <img src="https://upload.wikimedia.org/wikipedia/commons/2/24/Paytm_Logo_%28standalone%29.svg" class="app-logo"> Paytm
          </button>
          <button type="button" class="app-pay-btn" onclick="payWithApp('gpay')">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/f2/Google_Pay_Logo.svg" class="app-logo"> Google Pay
          </button>
        </div>
      </div>

      <button type="submit" class="place-order-btn">
        <span>🛒</span> Place Order Now
      </button>
    </form>
  </div>
</div>

<script>
  const WHATSAPP_NUMBER = "919353481235";
  const DEFAULT_UPI_ID = "9353481235@axl";
  const PAYEE_NAME = "BASVAKALYAN MART";
  const DELIVERY_CHARGE = 10; // Flat ₹10

  let shopOpen = true;
  let menuCategories = [];
  let activeCategory = ""; // Starts empty (No "ALL" tab)
  let globalUpi = { id: DEFAULT_UPI_ID, name: PAYEE_NAME };
  let cart = {}; 

  const searchInput = document.getElementById("searchInput");

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2000);
  }

  // ── TIME WINDOW CHECK ──
  function isItemAvailable(item) {
    if (!item.from && !item.to) return true;
    const now = new Date();
    const cur = now.getHours() * 60 + now.getMinutes();
    function toMin(t) { if (!t) return null; const [h, m] = t.split(":").map(Number); return h * 60 + (m || 0); }
    const f = toMin(item.from); const t = toMin(item.to);
    if (f === null && t === null) return true;
    if (f === null) return cur <= t;
    if (t === null) return cur >= f;
    if (f <= t) return cur >= f && cur <= t;
    return cur >= f || cur <= t;
  }

  function formatTime12(t) {
    if (!t) return ""; const [h, m] = t.split(":").map(Number);
    const ampm = h >= 12 ? "PM" : "AM"; const hh = h % 12 || 12;
    return `${hh}:${String(m).padStart(2, "0")} ${ampm}`;
  }

  // ── RENDER HOTEL TABS (No "All Items") ──
  function renderHotelTabs() {
    const container = document.getElementById("hotelTabs");
    container.innerHTML = "";

    menuCategories.forEach((cat, index) => {
      // Check if this hotel has ANY item available right now
      const hasAvailableItems = (cat.items || []).some(item => isItemAvailable(item));
      if (!hasAvailableItems) return; // Agar hotel ka koi item available nahi hai, toh tab hi mat dikhao

      // Auto-select the first available hotel
      if (activeCategory === "") activeCategory = cat.name;

      const btn = document.createElement("button");
      btn.className = `hotel-tab ${activeCategory === cat.name ? "active" : ""}`;
      btn.innerHTML = `🏨 ${cat.name}`;
      btn.onclick = () => { activeCategory = cat.name; renderHotelTabs(); renderMenu(); };
      container.appendChild(btn);
    });

    // Update Header Subtitle
    document.getElementById("hotelSubtitle").textContent = activeCategory || "Closed";
  }

  // ── RENDER MENU (Only Available Items) ──
  function renderMenu() {
    const grid = document.getElementById("menuGrid");
    grid.innerHTML = "";
    const query = searchInput.value.trim().toLowerCase();
    let totalVisible = 0;

    // Filter by selected category
    let categoriesToRender = menuCategories.filter(c => c.name === activeCategory);
    
    // Agar active category set nahi hai (sab band hain)
    if (categoriesToRender.length === 0) {
       grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
          <h2>⏰ Abhi Koi Dukan Band Hai</h2>
          <p>Kripya timing check karein. Us time ke hisaab se items show honge.</p>
       </div>`;
       document.getElementById("productCount").textContent = `0 items`;
       return;
    }

    categoriesToRender.forEach(category => {
      // Filter items: Must be available NOW and match search
      const matches = (category.items || []).filter(item => 
        isItemAvailable(item) && String(item.name || "").toLowerCase().includes(query)
      );
      
      if (!matches.length) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
          <h2>😕 Koi item available nahi hai</h2>
          <p>Is time par is hotel mein kuch nahi mil raha.</p>
       </div>`;
        return;
      }

      matches.forEach(item => {
        totalVisible++;
        const itemQty = cart[item.name] ? cart[item.name].qty : 0;
        
        const div = document.createElement("div");
        div.className = "card";
        
        // Time Badge (Will always show because these items are currently available)
        let timeBadge = (item.from || item.to) ? `<span class="card-time-badge">🕒 ${formatTime12(item.from)} - ${formatTime12(item.to)}</span>` : "";

        let actionHtml = "";
        if (itemQty > 0) {
          actionHtml = `
            <div class="qty-container">
              <button class="qty-btn" onclick="updateCart('${item.name}', ${item.price}, -1)">−</button>
              <span class="qty-num">${itemQty}</span>
              <button class="qty-btn" onclick="updateCart('${item.name}', ${item.price}, 1)">+</button>
            </div>`;
        } else {
          actionHtml = `
            <button class="add-btn" onclick="updateCart('${item.name}', ${item.price}, 1)">
              <span>🛍️</span> ADD ITEM
            </button>`;
        }

        div.innerHTML = `
          <div class="card-img-container">
            <img src="${item.image || 'https://via.placeholder.com/280x180?text=No+Image'}" loading="lazy">
            ${timeBadge}
          </div>
          <div class="card-content">
            <h3 class="card-title">${item.name}</h3>
            <p class="card-price">${Number(item.price) || 0}</p>
            ${actionHtml}
          </div>`;
        grid.appendChild(div);
      });
    });

    document.getElementById("productCount").textContent = totalVisible + " items";
  }

  // ── CART LOGIC ──
  window.updateCart = function(itemName, price, change) {
    if (!cart[itemName]) cart[itemName] = { price: price, qty: 0 };
    cart[itemName].qty += change;

    if (cart[itemName].qty <= 0) {
      delete cart[itemName];
    } else if (change > 0) {
      showToast(`✅ ${itemName} added!`);
    }
    
    renderMenu(); 
    updateFloatingCart(); 
  };

  function updateFloatingCart() {
    let totalItems = 0;
    let itemTotal = 0;
    
    Object.keys(cart).forEach(key => {
      totalItems += cart[key].qty;
      itemTotal += (cart[key].price * cart[key].qty);
    });

    const floatingCart = document.getElementById("floatingCart");
    
    if (totalItems > 0) {
      document.getElementById("cartItemsCount").textContent = `${totalItems} Items`;
      document.getElementById("cartTotalPrice").textContent = `₹${itemTotal}`;
      floatingCart.classList.add("show");
    } else {
      floatingCart.classList.remove("show");
      closeModal(); 
    }
  }

  function renderCheckoutBill() {
    const listContainer = document.getElementById("cartItemsList");
    listContainer.innerHTML = "";
    
    let itemTotal = 0;

    Object.keys(cart).forEach(itemName => {
      const item = cart[itemName];
      const subTotal = item.price * item.qty;
      itemTotal += subTotal;

      listContainer.innerHTML += `
        <div class="cart-item-row">
          <div class="cart-item-info">
            <span class="cart-item-name">${itemName}</span>
            <span class="cart-item-price">₹${item.price} x ${item.qty}</span>
          </div>
          <span class="cart-item-total">₹${subTotal}</span>
        </div>
      `;
    });

    const grandTotal = itemTotal + DELIVERY_CHARGE;

    document.getElementById("billItemTotal").textContent = `₹${itemTotal}`;
    document.getElementById("billDelivery").textContent = `₹${DELIVERY_CHARGE}`;
    document.getElementById("billGrandTotal").textContent = `₹${grandTotal}`;

    generateQR(grandTotal);
  }

  window.openCheckout = function() {
    if (Object.keys(cart).length === 0) return;
    
    renderCheckoutBill();
    document.getElementById("checkoutModal").classList.add("active");
    detectLocation();
    
    document.querySelector('input[value="UPI"]').checked = true;
    toggleQR(true);
  };

  window.closeModal = function() {
    document.getElementById("checkoutModal").classList.remove("active");
  };

  window.toggleQR = function(show) {
    document.getElementById("qrSection").style.display = show ? "block" : "none";
  };

  function detectLocation() {
    const addressField = document.getElementById("custAddress");
    const locStatus = document.getElementById("locStatus");
    
    addressField.value = "Fetching GPS...";
    locStatus.textContent = "Detecting location...";
    locStatus.style.color = "#e0530e";

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          addressField.value = `GPS: ${position.coords.latitude.toFixed(5)}, ${position.coords.longitude.toFixed(5)}`;
          locStatus.textContent = "✅ Location Detected";
          locStatus.style.color = "#1e9e4a";
        },
        (error) => {
          addressField.value = "Location Failed!";
          locStatus.textContent = "❌ GPS On karein. Order nahi ho sakta.";
          locStatus.style.color = "#d32f2f";
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }
  }

  function getGrandTotal() {
    let itemTotal = 0;
    Object.keys(cart).forEach(key => { itemTotal += (cart[key].price * cart[key].qty); });
    return itemTotal + DELIVERY_CHARGE;
  }

  function generateQR(amount) {
    const upiUrl = `upi://pay?pa=${globalUpi.id}&pn=${encodeURIComponent(globalUpi.name)}&am=${amount}&cu=INR`;
    document.getElementById("qrImage").src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(upiUrl)}`;
  }

  window.payWithApp = function(app) {
    const amount = getGrandTotal();
    const params = new URLSearchParams({
      pa: globalUpi.id, pn: globalUpi.name, am: String(amount),
      cu: 'INR', tn: `BASVAKALYAN MART Order`
    });
    const links = {
      phonepe: `phonepe://pay?${params}`,
      paytm: `paytmmp://pay?${params}`,
      gpay: `tez://upi/pay?${params}`
    };
    window.location.href = links[app];
  };

  window.placeOrder = function(event) {
    event.preventDefault();
    
    const locText = document.getElementById("custAddress").value;
    if(locText.includes("Failed") || locText.includes("Fetching")) {
      return alert("⚠️ Kripya GPS On karein aur location allow karein, tabhi order place hoga.");
    }

    const name = document.getElementById("custName").value;
    const phone = document.getElementById("custPhone").value;
    const address = locText;
    const paymentMethod = document.querySelector('input[name="payment"]:checked').value;

    let message = `*🔔 New Order - BASVAKALYAN MART*%0A%0A`;
    message += `*Customer Details:*%0A👤 Name: ${name}%0A📞 Phone: ${phone}%0A📍 Location: ${address}%0A%0A`;
    
    message += `*Items Ordered:*%0A`;
    let itemTotal = 0;
    Object.keys(cart).forEach(itemName => {
      const item = cart[itemName];
      const subTotal = item.price * item.qty;
      itemTotal += subTotal;
      message += `▪️ ${itemName} (x${item.qty}) - ₹${subTotal}%0A`;
    });

    const grandTotal = itemTotal + DELIVERY_CHARGE;
    message += `%0A*Delivery Charge:* ₹${DELIVERY_CHARGE} (Basvakalyan)%0A`;
    message += `*Total Amount:* ₹${grandTotal}%0A%0A`;
    message += `*Payment Mode:* ${paymentMethod}`;

    window.location.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;
  };

  // ── LOAD DATA ──
  async function loadMenu() {
    try {
      const response = await fetch('data.json?v=' + Date.now());
      if (!response.ok) throw new Error();
      const data = await response.json();

      if (data.upi) {
        globalUpi = { id: data.upi.id || DEFAULT_UPI_ID, name: data.upi.name || PAYEE_NAME };
      }
      if (data.hotelName) document.getElementById("hotelName").textContent = data.hotelName;
      
      if (Array.isArray(data.categories) && data.categories.length) {
        menuCategories = data.categories.map(c => ({ name: c.name || "Hotel", items: Array.isArray(c.items) ? c.items : [] }));
      } else if (Array.isArray(data.menu) && data.menu.length) {
        menuCategories = [{ name: data.hotelName || "BASVAKALYAN MART", items: data.menu }];
      }
    } catch (e) {
      menuCategories = [{ name: "BASVAKALYAN MART", items: [] }];
    }
    
    document.getElementById("upiIdDisplay").textContent = globalUpi.id;
    
    // Select first available hotel automatically
    if (menuCategories.length > 0) activeCategory = menuCategories[0].name;

    renderHotelTabs();
    renderMenu();
  }

  searchInput.addEventListener("input", renderMenu);
  
  // Auto refresh every minute to show/hide items based on time
  setInterval(() => { 
    renderHotelTabs(); 
    renderMenu(); 
  }, 60000); 

  loadMenu();
</script>
</body>
</html>
