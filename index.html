<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BK MART · Food Delivery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, sans-serif; }
    body { background: #f7f4f0; color: #1e1e1e; padding-bottom: 60px; }

    /* ── PREMIUM HEADER ── */
    .header { background: linear-gradient(135deg, #ffffff 0%, #fefbf8 100%); padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 200; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04); border-bottom: 1px solid rgba(139, 69, 19, 0.08); }
    .brand h1 { font-size: 2.2rem; font-weight: 800; background: linear-gradient(145deg, #8B4513 0%, #b85e1a 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1.1; }
    .brand .hotel-sub { font-size: 0.85rem; font-weight: 600; color: #b85e1a; margin-top: 4px; display: flex; align-items: center; gap: 8px; }
    .brand .hotel-sub .badge { background: linear-gradient(145deg, #ff6a2b, #e0530e); color: #fff; font-size: 0.7rem; padding: 3px 10px; border-radius: 20px; font-weight: 700; letter-spacing: .3px; box-shadow: 0 3px 8px rgba(224,83,14,0.3); }
    .brand p { font-size: 0.85rem; font-weight: 500; color: #8b6b4d; margin-top: 2px; }

    /* ── HOTEL TABS (NEW) ── */
    .hotel-tabs-container { max-width: 1200px; margin: 15px auto 0; padding: 0 20px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
    .hotel-tabs-container::-webkit-scrollbar { display: none; }
    .hotel-tabs { display: flex; gap: 10px; padding-bottom: 5px; }
    
    .hotel-tab {
      background: #ffffff; color: #8b6b4d; border: 1.5px solid #ede6de;
      padding: 10px 20px; border-radius: 50px; font-weight: 700; font-size: 0.9rem;
      cursor: pointer; transition: all .2s; display: flex; align-items: center; gap: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.02);
    }
    .hotel-tab:hover { border-color: #dbbd9c; background: #fffaf6; }
    .hotel-tab.active {
      background: linear-gradient(145deg, #ff6a2b, #e0530e); color: white;
      border-color: transparent; box-shadow: 0 6px 16px -4px rgba(224,83,14,0.4);
    }
    
    /* ── SEARCH ── */
    .search-container { max-width: 900px; margin: 15px auto 10px; padding: 0 20px; }
    .search-box { display: flex; align-items: center; background: white; border: 1px solid #ede6de; border-radius: 60px; padding: 12px 22px; box-shadow: 0 4px 16px rgba(0,0,0,0.03); transition: box-shadow .2s, border .2s; }
    .search-box:focus-within { box-shadow: 0 4px 24px rgba(184,94,26,0.15); border-color: #dbbd9c; }
    .search-box input { border: none; outline: none; width: 100%; font-size: 1rem; margin-left: 12px; background: transparent; }

    /* ── ALERTS ── */
    .alert-closed { max-width: 900px; margin: 0 auto 16px; background: #fff1f0; color: #b3402c; padding: 16px 24px; border-radius: 60px; text-align: center; font-weight: 700; display: none; }

    /* ── MENU GRID ── */
    .menu-container { max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 26px; }
    .card { background: #ffffff; border-radius: 28px; overflow: hidden; box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.06); display: flex; flex-direction: column; border: 1px solid #f3ede8; transition: transform .2s, box-shadow .2s; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -12px rgba(0,0,0,0.1); }
    .card-img-container { position: relative; width: 100%; height: 190px; background: #efe8e0; }
    .card-img-container img { width: 100%; height: 100%; object-fit: cover; }
    
    .card-time-badge { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,.65); color: #fff; font-size: .7rem; font-weight: 700; padding: 5px 12px; border-radius: 20px; backdrop-filter: blur(6px); letter-spacing: .3px; display: flex; align-items: center; gap: 4px; }
    .card-time-badge.closed { background: rgba(220, 38, 38, 0.9); }
    
    .card-hotel-badge { position: absolute; top: 12px; left: 12px; background: rgba(255, 255, 255, 0.9); color: #b85e1a; font-size: .7rem; font-weight: 800; padding: 5px 10px; border-radius: 20px; backdrop-filter: blur(6px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    
    .card-content { padding: 18px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { font-size: 1.2rem; font-weight: 700; color: #2c1d12; margin-bottom: 4px; }
    .card-price { font-size: 1.1rem; color: #b85e1a; font-weight: 800; margin-bottom: 16px; }
    .card-price::before { content: "₹"; font-weight: 700; margin-right: 2px; }

    /* ── PREMIUM BUY BUTTON ── */
    .buy-btn {
      margin-top: auto;
      background: linear-gradient(145deg, #ff7a2b 0%, #e0530e 100%);
      color: white; border: none; padding: 14px 10px; border-radius: 50px;
      font-weight: 800; cursor: pointer; font-size: 0.95rem; letter-spacing: .3px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all .25s; box-shadow: 0 8px 20px -4px rgba(224,83,14,0.45);
      position: relative; overflow: hidden; text-align: center;
    }
    .buy-btn::after { content: ""; position: absolute; inset: 0; background: linear-gradient(145deg, rgba(255,255,255,.25), transparent); opacity: 0; transition: opacity .25s; }
    .buy-btn:not(.closed):hover { transform: translateY(-2px); box-shadow: 0 12px 28px -4px rgba(224,83,14,0.6); }
    .buy-btn:not(.closed):hover::after { opacity: 1; }
    .buy-btn:not(.closed):active { transform: scale(.97); }
    
    .buy-btn.closed { background: #f1f1f1; color: #888; box-shadow: none; border: 1px solid #e0e0e0; }

    /* ── MODAL ── */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(20, 15, 10, 0.7); z-index: 1000; justify-content: center; align-items: center; padding: 16px; backdrop-filter: blur(4px); }
    .modal.active { display: flex; }
    .modal-content { background: #ffffff; width: 100%; max-width: 460px; border-radius: 32px; padding: 28px; max-height: 92vh; overflow-y: auto; animation: modalIn .25s ease; }
    @keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid #f0e6de; padding-bottom: 14px; }
    .modal-header h2 { font-size: 1.4rem; font-weight: 800; color: #2c1d12; }
    .close-btn { background: none; border: none; font-size: 2rem; cursor: pointer; color: #a78b7a; line-height: 1; transition: color .2s; }
    .close-btn:hover { color: #b85e1a; }
    #orderSummary { margin-bottom: 22px; background: #fdf8f4; padding: 16px; border-radius: 20px; border-left: 6px solid #b85e1a; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; color: #5f4b3a; }
    .form-group input, .form-group textarea { width: 100%; padding: 14px; border: 1px solid #e2d8d0; border-radius: 18px; font-family: inherit; font-size: 0.95rem; transition: border .2s, box-shadow .2s; }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #b85e1a; box-shadow: 0 0 0 3px rgba(184,94,26,0.12); }

    /* ── PAYMENT OPTIONS ── */
    .payment-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
    .pay-label { display: flex; align-items: center; padding: 15px 18px; border: 1.5px solid #ede6de; border-radius: 18px; cursor: pointer; font-weight: 600; background: #fefcfb; transition: all .2s; gap: 8px; }
    .pay-label:hover { border-color: #dbbd9c; background: #fffaf6; }
    .pay-label:has(input:checked) { border-color: #b85e1a; background: #fdf2e9; box-shadow: 0 0 0 3px rgba(184,94,26,0.1); }

    /* ── QR & APP BUTTONS ── */
    .qr-section { display: none; text-align: center; margin: 16px 0; padding: 20px; background: #fdf8f4; border-radius: 22px; border: 1px dashed #dbbd9c; }
    .qr-section img#qrImage { width: 180px; height: 180px; margin-top: 10px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    
    .app-pay-btn {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 12px; border: 1.5px solid #ede6de; border-radius: 18px;
      background: #fff; cursor: pointer; transition: all .2s;
      font-size: 1rem; font-weight: 700; color: #333; width: 100%;
    }
    .app-pay-btn:hover { border-color: #b85e1a; background: #fffaf6; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,.06); }
    .app-pay-btn:active { transform: scale(.98); }
    .app-logo { height: 24px; width: auto; object-fit: contain; display: block; }

    /* ── PREMIUM PLACE ORDER BUTTON ── */
    .place-order-btn {
      width: 100%;
      background: linear-gradient(145deg, #1e9e4a 0%, #157a36 100%);
      color: white; padding: 18px; border: none; border-radius: 50px;
      font-size: 1.1rem; font-weight: 800; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: all .25s; box-shadow: 0 8px 24px -4px rgba(21,122,54,0.45);
      letter-spacing: .3px; position: relative; overflow: hidden;
    }
    .place-order-btn::after { content: ""; position: absolute; inset: 0; background: linear-gradient(145deg, rgba(255,255,255,.2), transparent); opacity: 0; transition: opacity .25s; }
    .place-order-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 32px -4px rgba(21,122,54,0.6); }
    .place-order-btn:hover::after { opacity: 1; }
    .place-order-btn:active { transform: scale(.98); }
    .place-order-btn .btn-icon { font-size: 1.3rem; }
  </style>
</head>
<body>

<div class="header">
  <div class="brand">
    <h1 id="hotelName">BK FOOD DELIVERY</h1>
    <div class="hotel-sub">
      <span id="hotelSubtitle">ALL ITEMS</span>
      <span class="badge" id="productCount">0 items</span>
    </div>
    <p>★★★★★ 4.5</p>
  </div>
</div>

<!-- HOTEL CATEGORIES TABS -->
<div class="hotel-tabs-container">
  <div class="hotel-tabs" id="hotelTabs">
    <!-- JS se generate hoga -->
  </div>
</div>

<div class="search-container">
  <div class="search-box">
    <span>🔍</span>
    <input type="text" id="searchInput" placeholder="Search Biryani, Dosa...">
  </div>
</div>

<div id="shopAlert" class="alert-closed">⚠️ Aaj Dukan Band Hai (Shop Closed for Holiday)</div>

<div class="menu-container" id="menuGrid"></div>

<!-- CHECKOUT MODAL -->
<div class="modal" id="checkoutModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Checkout</h2>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>

    <div id="orderSummary"></div>

    <form id="checkoutForm" onsubmit="placeOrder(event)">
      <div class="form-group">
        <label>Your Name</label>
        <input type="text" id="custName" required placeholder="Full name">
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="custPhone" required placeholder="10-digit mobile" pattern="[0-9]{10}">
      </div>
      <div class="form-group">
        <label>Delivery Address (Auto-detect ho raha hai...)</label>
        <textarea id="custAddress" required rows="2" placeholder="Location fetch ho rahi hai..."></textarea>
      </div>

      <label style="font-weight: 700; margin-bottom: 10px; display: block;">Payment Method</label>
      <div class="payment-options">
        <label class="pay-label" onclick="toggleQR(true)">
          <input type="radio" name="payment" value="UPI" checked>
          📱 Online Payment (UPI)
        </label>
        <label class="pay-label" onclick="toggleQR(false)">
          <input type="radio" name="payment" value="COD">
          💵 Cash on Delivery
        </label>
      </div>

      <div class="qr-section" id="qrSection">
        <p style="font-weight:600;">Scan QR to Pay</p>
        <img id="qrImage" src="" alt="UPI QR">
        <p style="margin-top:10px; font-size:0.8rem; color:#777;">UPI ID: <b id="upiIdDisplay">9353481235@axl</b></p>
        
        <div class="payment-options" style="margin-top: 15px;">
          <button type="button" class="app-pay-btn" onclick="payWithApp('phonepe')">
            <img src="https://upload.wikimedia.org/wikipedia/commons/7/71/PhonePe_Logo.svg" alt="PhonePe Logo" class="app-logo"> 
            <span>PhonePe</span>
          </button>
          
          <button type="button" class="app-pay-btn" onclick="payWithApp('paytm')">
            <img src="https://upload.wikimedia.org/wikipedia/commons/2/24/Paytm_Logo_%28standalone%29.svg" alt="Paytm Logo" class="app-logo"> 
            <span>Paytm</span>
          </button>
          
          <button type="button" class="app-pay-btn" onclick="payWithApp('gpay')">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/f2/Google_Pay_Logo.svg" alt="Google Pay Logo" class="app-logo"> 
            <span>Google Pay</span>
          </button>
        </div>
      </div>

      <button type="submit" class="place-order-btn">
        <span class="btn-icon">🛒</span> Place Order · Pay Now
      </button>
    </form>
  </div>
</div>

<script>
  // ==========================================
  // ✅ SETTINGS
  // ==========================================
  const WHATSAPP_NUMBER = "919353481235";
  const DEFAULT_UPI_ID = "9353481235@axl";
  const PAYEE_NAME = "BK MART";

  let shopOpen = true;
  let currentItem = null;
  let allMenuItems = [];
  let menuCategories = [];
  let activeCategory = "ALL"; // Currently selected hotel
  let globalUpi = { id: DEFAULT_UPI_ID, name: PAYEE_NAME, enabled: true };

  const searchInput = document.getElementById("searchInput");
  const shopAlert = document.getElementById("shopAlert");

  // ── TIME WINDOW CHECK ──
  function isItemAvailable(item) {
    if (!item.from && !item.to) return true;
    const now = new Date();
    const cur = now.getHours() * 60 + now.getMinutes();
    
    function toMin(t) {
      if (!t) return null;
      const [h, m] = t.split(":").map(Number);
      return h * 60 + (m || 0);
    }
    
    const f = toMin(item.from);
    const t = toMin(item.to);
    
    if (f === null && t === null) return true;
    if (f === null) return cur <= t;
    if (t === null) return cur >= f;
    if (f <= t) return cur >= f && cur <= t;
    return cur >= f || cur <= t;
  }

  function formatTime12(t) {
    if (!t) return "";
    const [h, m] = t.split(":").map(Number);
    const ampm = h >= 12 ? "PM" : "AM";
    const hh = h % 12 || 12;
    return `${hh}:${String(m).padStart(2, "0")} ${ampm}`;
  }

  // ── RENDER HOTEL TABS (NEW) ──
  function renderHotelTabs() {
    const container = document.getElementById("hotelTabs");
    container.innerHTML = "";

    // "All Items" Tab
    const allTab = document.createElement("button");
    allTab.className = `hotel-tab ${activeCategory === "ALL" ? "active" : ""}`;
    allTab.innerHTML = `🍽️ All Items`;
    allTab.onclick = () => {
      activeCategory = "ALL";
      renderHotelTabs();
      renderMenu();
    };
    container.appendChild(allTab);

    // Hotel Tabs
    menuCategories.forEach(cat => {
      if (!cat.items || cat.items.length === 0) return; // Empty categories skip

      const btn = document.createElement("button");
      btn.className = `hotel-tab ${activeCategory === cat.name ? "active" : ""}`;
      btn.innerHTML = `🏨 ${cat.name}`;
      btn.onclick = () => {
        activeCategory = cat.name;
        renderHotelTabs();
        renderMenu();
      };
      container.appendChild(btn);
    });
  }

  // ── RENDER MENU CARDS ──
  function renderMenu() {
    const grid = document.getElementById("menuGrid");
    grid.innerHTML = "";
    const query = searchInput.value.trim().toLowerCase();
    let found = 0;
    let totalVisible = 0;

    // Filter based on selected hotel
    let categoriesToRender = menuCategories;
    if (activeCategory !== "ALL") {
      categoriesToRender = menuCategories.filter(c => c.name === activeCategory);
    }

    // Header Text Update
    document.getElementById("hotelSubtitle").textContent = activeCategory === "ALL" ? "ALL ITEMS" : activeCategory;

    categoriesToRender.forEach(category => {
      const matches = (category.items || []).filter(item =>
        String(item.name || "").toLowerCase().includes(query)
      );
      
      if (!matches.length) return;
      found += matches.length;

      matches.forEach(item => {
        totalVisible++;
        const isAvailable = isItemAvailable(item);
        
        const div = document.createElement("div");
        div.className = "card";
        const imgSrc = item.image || "https://via.placeholder.com/280x180?text=No+Image";
        
        let timeBadge = "";
        if (item.from || item.to) {
          let timeStr = `${formatTime12(item.from) || "—"} - ${formatTime12(item.to) || "—"}`;
          timeBadge = `<span class="card-time-badge ${isAvailable ? '' : 'closed'}">🕒 ${timeStr}</span>`;
        }

        // Show Hotel Name Badge only if we are in "ALL" view
        let hotelBadge = (activeCategory === "ALL") ? `<span class="card-hotel-badge">🏨 ${category.name}</span>` : "";

        let btnClass = isAvailable ? "" : "closed";
        let btnText = isAvailable ? "BUY NOW" : "CLOSED";
        let btnIcon = isAvailable ? "🛍️" : "⏰";

        div.innerHTML = `
          <div class="card-img-container">
            <img src="${imgSrc}">
            ${timeBadge}
            ${hotelBadge}
          </div>
          <div class="card-content">
            <h3 class="card-title">${item.name}</h3>
            <p class="card-price">${Number(item.price) || 0}</p>
            <button class="buy-btn ${btnClass}">
              <span class="btn-icon">${btnIcon}</span> ${btnText}
            </button>
          </div>`;
          
        div.querySelector(".buy-btn").addEventListener("click", () => {
          if (!isAvailable) {
            let timeStr = `${formatTime12(item.from) || "Start"} se ${formatTime12(item.to) || "End"}`;
            alert(`⏰ Sorry! Yeh item abhi available nahi hai.\n\nAap ise sirf ${timeStr} ke beech hi order kar sakte hain.`);
            return;
          }
          openCheckout(item.name, Number(item.price) || 0, category.name);
        });
        
        grid.appendChild(div);
      });
    });

    document.getElementById("productCount").textContent = totalVisible + " items";

    if (!found) {
      grid.innerHTML = "<p style='grid-column:1/-1;text-align:center;padding:35px;color:#888'>Is hotel mein koi item nahi mila.</p>";
    }
  }

  // ── LOAD DATA ──
  async function loadMenu() {
    try {
      const response = await fetch('data.json?v=' + Date.now());
      if (!response.ok) throw new Error();
      const data = await response.json();

      shopOpen = data.shopStatus !== "closed";
      shopAlert.style.display = shopOpen ? "none" : "block";

      if (data.upi) {
        globalUpi = {
          id: data.upi.id || DEFAULT_UPI_ID,
          name: data.upi.name || PAYEE_NAME,
          enabled: data.upi.enabled !== false
        };
      }
      
      if (data.hotelName) document.getElementById("hotelName").textContent = data.hotelName;
      
      if (Array.isArray(data.categories) && data.categories.length) {
        menuCategories = data.categories.map(c => ({
          name: c.name || "Hotel",
          items: Array.isArray(c.items) ? c.items : []
        }));
        allMenuItems = menuCategories.flatMap(c => c.items);
      } else if (Array.isArray(data.menu) && data.menu.length) {
        menuCategories = [{ name: data.hotelName || "BK MART", items: data.menu }];
        allMenuItems = data.menu;
      } else {
        throw new Error("No items found");
      }
      
    } catch (e) {
      menuCategories = [{ name: "BK MART", items: [] }];
      allMenuItems = [];
    }
    
    document.getElementById("upiIdDisplay").textContent = globalUpi.id;
    renderHotelTabs(); // Render tabs first
    renderMenu();      // Then render items
  }

  searchInput.addEventListener("input", renderMenu);
  setInterval(() => { renderHotelTabs(); renderMenu(); }, 60000);

  // ── LOCATION & CHECKOUT ──
  function detectLocation() {
    const addressField = document.getElementById("custAddress");
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          addressField.value = `Lat: ${position.coords.latitude}, Lng: ${position.coords.longitude} (Please add house details)`;
        },
        () => { addressField.placeholder = "Location denied. Please type address manually."; }
      );
    }
  }

  function generateQR(amount) {
    const upiUrl = `upi://pay?pa=${globalUpi.id}&pn=${encodeURIComponent(globalUpi.name)}&am=${amount}&cu=INR`;
    document.getElementById("qrImage").src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(upiUrl)}`;
  }

  window.openCheckout = function(name, price, hotelName) {
    if (!shopOpen) return alert("Shop is closed today.");
    currentItem = { name, price };
    document.getElementById("orderSummary").innerHTML = `
      <h4>${name}</h4>
      <p style="font-size:0.85rem; color:#8b6b4d;">Hotel: ${hotelName}</p>
      <p style="font-weight:800; margin-top:5px;">₹${price}</p>
    `;
    document.getElementById("checkoutModal").classList.add("active");
    generateQR(price);
    detectLocation();
    
    document.querySelector('input[value="UPI"]').checked = true;
    toggleQR(true);
  };

  window.closeModal = function() {
    document.getElementById("checkoutModal").classList.remove("active");
    document.getElementById("checkoutForm").reset();
    document.getElementById("qrImage").src = "";
  };

  window.toggleQR = function(show) {
    document.getElementById("qrSection").style.display = show ? "block" : "none";
  };

  window.payWithApp = function(app) {
    if (!currentItem) return;
    const params = new URLSearchParams({
      pa: globalUpi.id, pn: globalUpi.name, am: String(currentItem.price),
      cu: 'INR', tn: `Order - ${currentItem.name}`
    });
    const query = params.toString();
    const links = {
      phonepe: `phonepe://pay?${query}`,
      paytm: `paytmmp://pay?${query}`,
      gpay: `tez://upi/pay?${query}`
    };
    window.location.href = links[app];
  };

  window.placeOrder = function(event) {
    event.preventDefault();
    const name = document.getElementById("custName").value;
    const phone = document.getElementById("custPhone").value;
    const address = document.getElementById("custAddress").value;
    const paymentMethod = document.querySelector('input[name="payment"]:checked').value;

    let message = `*New Order - ${globalUpi.name}*%0A%0A`;
    message += `*Item:* ${currentItem.name}%0A`;
    message += `*Price:* ₹${currentItem.price}%0A`;
    message += `*Payment:* ${paymentMethod}%0A%0A`;
    message += `*Customer Details:*%0A`;
    message += `Name: ${name}%0A`;
    message += `Phone: ${phone}%0A`;
    message += `Address: ${address}`;

    window.location.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;
  };

  loadMenu();
</script>
</body>
</html>
