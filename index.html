<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BK MART - Biryani House</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
  body { background:#f9f9f9; padding:20px; }
  h1 { text-align:center; margin-bottom:20px; color:#8B4513; }
  
  .alert-closed { background:#f8d7da; color:#721c24; padding:15px; border-radius:8px; text-align:center; font-weight:bold; margin-bottom:20px; border: 1px solid #f5c6cb; }
  
  .menu-grid {
    display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:20px; max-width:1000px; margin:0 auto;
  }
  .menu-item {
    background:white; border-radius:10px; overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
  }
  .menu-item img {
    width:100%; height:160px; object-fit:cover; background:#eee;
  }
  .menu-item .info { padding:15px; }
  .menu-item h3 { margin-bottom:8px; color:#333; }
  .menu-item .price { color:#28a745; font-weight:bold; font-size:18px; }
</style>
</head>
<body>
<h1>🍛 BK MART - Biryani House</h1>

<!-- Shop Closed Alert -->
<div id="shopAlert" style="display:none;" class="alert-closed">
  ⚠️ Aaj Dukan Band Hai (Today is Holiday)
</div>

<div class="menu-grid" id="menuGrid"></div>

<script>
async function renderMenu() {
  const grid = document.getElementById("menuGrid");
  const alertBox = document.getElementById("shopAlert");
  
  try {
    // Cache clear karne ke liye ek timestamp add kiya gaya hai
    const response = await fetch('data.json?v=' + new Date().getTime());
    const data = await response.json();
    
    // Check shop status
    if (data.shopStatus === "closed") {
      alertBox.style.display = "block";
    }

    grid.innerHTML = "";

    if (!data.menu || data.menu.length === 0) {
      grid.innerHTML = "<p style='text-align:center;grid-column:1/-1;'>Abhi koi item nahi hai.</p>";
      return;
    }

    data.menu.forEach(item => {
      const div = document.createElement("div");
      div.className = "menu-item";
      
      // Agar Photo URL nahi diya gaya hai, toh placeholder dikhao
      const imgSrc = item.image ? item.image : "https://via.placeholder.com/220x160?text=" + encodeURIComponent(item.name);
      
      div.innerHTML = `
        <img src="${imgSrc}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/220x160?text=No+Image'">
        <div class="info">
          <h3>${item.name}</h3>
          <p class="price">₹${item.price}</p>
        </div>
      `;
      grid.appendChild(div);
    });

  } catch (error) {
    grid.innerHTML = "<p style='text-align:center;grid-column:1/-1;color:red;'>Data load nahi hua.</p>";
  }
}

renderMenu();
</script>
</body>
</html>
