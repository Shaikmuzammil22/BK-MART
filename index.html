<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BASVAKALYAN MART</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <style>
    /* ── PREMIUM BLACK & GOLD THEME ── */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; }
    
    :root {
      --gold: #D4AF37;
      --gold-dark: #B8860B;
      --black: #111111;
      --dark-grey: #222222;
      --light-bg: #f9f6f0;
    }

    body { 
      background: var(--light-bg);
      color: var(--black); 
      padding-bottom: 100px; 
      overflow-x: hidden; 
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    /* ── PREMIUM HEADER ── */
    .header { background: var(--black); padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 200; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2); border-bottom: 2px solid var(--gold); }
    
    .brand h1 { 
      font-size: 1.6rem;
      font-weight: 900; 
      font-family: 'Playfair Display', serif;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(to bottom, #CFB53B, #FCF6BA, #B38728, #FBF5B7, #AA771C);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      white-space: nowrap;
    }
    
    .brand .hotel-sub { font-size: 0.85rem; font-weight: 700; color: var(--gold); margin-top: 4px; display: flex; align-items: center; gap: 8px; }

    /* ── CALL BUTTON ── */
    .call-btn { background: linear-gradient(145deg, var(--gold), var(--gold-dark)); color: var(--black); padding: 10px 18px; border-radius: 50px; font-weight: 800; text-decoration: none; display: flex; align-items: center; gap: 6px; font-size: 0.9rem; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4); transition: 0.3s; }
    .call-btn:hover { transform: scale(1.05); }

    /* ── SEARCH ── */
    .search-container { max-width: 900px; margin: 15px auto 10px; padding: 0 20px; }
    .search-box { display: flex; align-items: center; background: #ffffff; border: 1.5px solid var(--gold); border-radius: 60px; padding: 12px 22px; box-shadow: 0 4px 16px rgba(212, 175, 55, 0.1); transition: all 0.3s; }
    .search-box:focus-within { box-shadow: 0 8px 24px rgba(212, 175, 55, 0.3); }
    .search-box input { border: none; outline: none; width: 100%; font-size: 1rem; margin-left: 12px; background: transparent; color: var(--black); }

    /* ── SECTIONS (Available / Closed) ── */
    .section-header { max-width: 1200px; margin: 25px auto 10px; padding: 0 20px; font-size: 1.2rem; font-weight: 900; color: var(--black); display: flex; align-items: center; gap: 10px; }
    .section-header span { background: var(--gold); padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; color: var(--black); font-weight: 800; }
    .hotel-name-tag { max-width: 1200px; margin: 15px auto 5px; padding: 0 20px; font-size: 1.1rem; font-weight: 800; color: var(--gold-dark); border-bottom: 1px dashed #ccc; padding-bottom: 5px; }

    /* ── MENU GRID ── */
    .menu-container { max-width: 1200px; margin: 0 auto; padding: 10px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 26px; }
    
    .card { background: #ffffff; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 20px -5px rgba(0, 0, 0, 0.1); display: flex; flex-direction: column; border: 1px solid #eaeaea; transition: all 0.3s; }
    .card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px -10px rgba(212, 175, 55, 0.3); }
    
    /* CLOSED ITEM STYLE */
    .card.closed { opacity: 0.7; filter: grayscale(0.8); }
    .card.closed:hover { transform: none; box-shadow: 0 8px 20px -5px rgba(0, 0, 0, 0.1); }
    
    .card-img-container { position: relative; width: 100%; height: 180px; }
    .card-img-container img { width: 100%; height: 100%; object-fit: cover; }
    
    .card-time-badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); color: var(--gold); font-size: .7rem; font-weight: 700; padding: 5px 10px; border-radius: 20px; }
    .card-time-badge.closed-badge { background: rgba(220, 38, 38, 0.9); color: white; }
    
    .card-content { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { font-size: 1.1rem; font-weight: 800; color: var(--black); margin-bottom: 4px; }
    .card-price { font-size: 1.1rem; color: var(--gold-dark); font-weight: 900; margin-bottom: 15px; }
    .card-price::before { content: "₹"; margin-right: 2px; }

    /* ── BUY BUTTON ── */
    .buy-action-btn { margin-top: auto; background: linear-gradient(145deg, var(--black), var(--dark-grey)); color: var(--gold); border: 1px solid var(--gold); padding: 12px; border-radius: 50px; font-weight: 800; cursor: pointer; font-size: 0.95rem; transition: all 0.3s; }
    .buy-action-btn:hover { background: var(--gold); color: var(--black); }
    .buy-action-btn.closed { background: #e0e0e0; color: #888; border-color: #ccc; cursor: not-allowed; }

    /* ── MODALS ── */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
    .modal.active { display: flex; animation: fadeIn 0.3s ease; }
    .modal-content { background: #ffffff; width: 90%; max-width: 400px; border-radius: 20px; padding: 25px; position: relative; border-top: 5px solid var(--gold); animation: popIn 0.3s ease; max-height: 90vh; overflow-y: auto; }
    
    .close-btn { position: absolute; top: 15px; right: 15px; background: #f5f5f5; border: none; font-size: 1.2rem; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; color: #333; }
    
    /* QTY POPUP */
    .qty-popup-img { width: 100px; height: 100px; object-fit: cover; border-radius: 15px; margin: 0 auto 15px auto; display: block; }
    .qty-popup-title { text-align: center; font-size: 1.2rem; font-weight: 800; color: var(--black); }
    .qty-popup-price { text-align: center; color: var(--gold-dark); font-weight: 800; margin-bottom: 15px; font-size: 1.1rem;}
    
    .qty-popup-controls { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px; }
    .qty-popup-btn { background: #f0f0f0; color: var(--black); border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 1.3rem; font-weight: bold; cursor: pointer; }
    .qty-popup-num { font-size: 1.5rem; font-weight: 800; }
    
    .qty-popup-add-btn { width: 100%; background: linear-gradient(145deg, var(--gold), var(--gold-dark)); color: var(--black); padding: 15px; border: none; border-radius: 50px; font-size: 1.1rem; font-weight: 900; cursor: pointer; }

    /* CHECKOUT FORM */
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 700; font-size: 0.85rem; color: #555; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 1.5px solid #ccc; border-radius: 10px; font-size: 0.95rem; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--gold); outline: none; }
    
    .place-order-btn { width: 100%; background: #1e9e4a; color: white; padding: 15px; border: none; border-radius: 50px; font-size: 1.1rem; font-weight: 800; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 15px rgba(30,158,74,0.3); }

    /* TRACK ORDER BUTTON */
    .track-btn { position: fixed; bottom: 20px; right: 20px; background: var(--black); color: var(--gold); border: 2px solid var(--gold); padding: 12px 20px; border-radius: 50px; font-weight: 800; font-size: 0.9rem; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 500; display: flex; align-items: center; gap: 8px; }

    /* TRACKING STATUS */
    .status-tracker { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
    .status-step { display: flex; align-items: center; gap: 15px; opacity: 0.4; transition: 0.3s; }
    .status-step.active { opacity: 1; }
    .status-icon { width: 35px; height: 35px; border-radius: 50%; background: #e0e0e0; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
    .status-step.active .status-icon { background: var(--gold); color: var(--black); box-shadow: 0 0 10px rgba(212, 175, 55, 0.5); }
    .status-text { font-weight: 700; font-size: 0.95rem; color: var(--black); }

    #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--black); color: var(--gold); border: 1px solid var(--gold); padding: 12px 24px; border-radius: 30px; font-weight: 700; font-size: 0.9rem; z-index: 2000; transition: all 0.4s; opacity: 0; }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    
    .empty-state { text-align: center; padding: 50px 20px; color: #888; grid-column: 1/-1; }
  </style>
</head>
<body>

<div id="toast">Order Placed Successfully!</div>

<!-- HEADER -->
<div class="header">
  <div class="brand">
    <h1 id="hotelName">BASVAKALYAN MART</h1>
    <div class="hotel-sub"><span id="hotelSubtitle">Multi-Hotel Kitchen</span></div>
  </div>
  <a href="tel:+919353481235" class="call-btn">📞 Call</a>
</div>

<div class="search-container">
  <div class="search-box">
    <span style="color:var(--gold-dark); font-size:1.2rem;">🔍</span>
    <input type="text" id="searchInput" placeholder="Search items...">
  </div>
</div>

<!-- Yahan JS se sections banenge -->
<div id="menuRoot"></div>

<!-- TRACK ORDER FLOATING BUTTON -->
<button class="track-btn" onclick="openTrackModal()">
  🚚 Track Order
</button>

<!-- QUANTITY POPUP MODAL -->
<div class="modal" id="qtyModal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeQtyModal()">×</button>
    <img id="qtyPopupImg" class="qty-popup-img" src="" alt="Item">
    <h2 id="qtyPopupTitle" class="qty-popup-title">Item Name</h2>
    <p id="qtyPopupPrice" class="qty-popup-price">₹0</p>
    
    <div class="qty-popup-controls">
      <button class="qty-popup-btn" onclick="changePopupQty(-1)">−</button>
      <span id="qtyPopupNum" class="qty-popup-num">1</span>
      <button class="qty-popup-btn" onclick="changePopupQty(1)">+</button>
    </div>
    
    <button class="qty-popup-add-btn" onclick="directBuy()">Confirm & Buy</button>
  </div>
</div>

<!-- CHECKOUT MODAL -->
<div class="modal" id="checkoutModal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal()">×</button>
    <h2 style="font-size:1.3rem; font-weight:900; margin-bottom:15px; color:var(--black);">Delivery Details</h2>

    <div style="background:#fafafa; padding:10px; border-radius:10px; border-left:4px solid var(--gold); margin-bottom:15px;">
      <p style="font-size:0.9rem; font-weight:700; color:#555;">Item: <span id="checkoutItemName" style="color:var(--black);"></span></p>
      <p style="font-size:0.9rem; font-weight:700; color:#555;">Total: <span id="checkoutItemTotal" style="color:var(--gold-dark);"></span> (Incl. ₹10 Delivery)</p>
    </div>

    <form id="checkoutForm" onsubmit="placeOrder(event)">
      <div class="form-group">
        <label>Your Name</label>
        <input type="text" id="custName" required placeholder="Full name">
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="custPhone" required placeholder="10-digit mobile" pattern="[0-9]{10}">
      </div>
      
      <div class="form-group">
        <label>📍 Auto-Detect Location</label>
        <textarea id="custAddress" readonly required rows="2" style="background:#f0f0f0; color:#555;">Detecting GPS...</textarea>
      </div>

      <div class="form-group">
        <label>Payment Method</label>
        <select id="paymentMethod" style="padding:12px; border-radius:10px; border:1.5px solid #ccc; font-weight:700;">
          <option value="Cash on Delivery">Cash on Delivery</option>
          <option value="UPI / Online">UPI / Online</option>
        </select>
      </div>

      <button type="submit" class="place-order-btn">Confirm Order</button>
    </form>
  </div>
</div>

<!-- TRACK ORDER MODAL -->
<div class="modal" id="trackModal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeTrackModal()">×</button>
    <h2 style="font-size:1.3rem; font-weight:900; margin-bottom:15px; color:var(--black);">Track Your Order</h2>

    <div class="form-group">
      <label>Enter Phone Number</label>
      <input type="tel" id="trackPhone" placeholder="10-digit mobile">
    </div>
    <button class="buy-action-btn" onclick="checkStatus()" style="background:var(--gold); color:var(--black); margin-bottom:20px; width:100%;">Check Status</button>

    <div class="status-tracker" id="statusTracker" style="display:none;">
      <div class="status-step" id="step-pending">
        <div class="status-icon">🕒</div>
        <div class="status-text">Order Pending (Preparing)</div>
      </div>
      <div class="status-step" id="step-arriving">
        <div class="status-icon">🛵</div>
        <div class="status-text">Out for Delivery (Arriving)</div>
      </div>
      <div class="status-step" id="step-delivered">
        <div class="status-icon">✅</div>
        <div class="status-text">Delivered</div>
      </div>
    </div>
  </div>
</div>

<script>
  const WHATSAPP_NUMBER = "919353481235";
  const DELIVERY_CHARGE = 10;

  let menuCategories = [];
  let selectedItem = null;
  let selectedQty = 1;

  const searchInput = document.getElementById("searchInput");

  // Load Menu Data
  async function loadMenu() {
    try {
      const response = await fetch('data.json?v=' + Date.now());
      const data = await response.json();
      
      if (Array.isArray(data.categories) && data.categories.length) {
        menuCategories = data.categories.map(c => ({ name: c.name || "Hotel", items: Array.isArray(c.items) ? c.items : [] }));
      } else if (Array.isArray(data.menu) && data.menu.length) {
        menuCategories = [{ name: data.hotelName || "BASVAKALYAN MART", items: data.menu }];
      }
    } catch (e) {
      menuCategories = [{ name: "BASVAKALYAN MART", items: [] }];
    }
    
    renderAllItems();
  }

  // Time Check
  function isItemAvailable(item) {
    if (!item.from && !item.to) return true;
    const now = new Date();
    const cur = now.getHours() * 60 + now.getMinutes();
    function toMin(t) { if (!t) return null; const [h, m] = t.split(":").map(Number); return h * 60 + (m || 0); }
    const f = toMin(item.from); const t = toMin(item.to);
    if (f === null && t === null) return true;
    if (f === null) return cur <= t;
    if (t === null) return cur >= f;
    return (f <= t) ? (cur >= f && cur <= t) : (cur >= f || cur <= t);
  }

  function formatTime12(t) {
    if (!t) return ""; const [h, m] = t.split(":").map(Number);
    const ampm = h >= 12 ? "PM" : "AM"; const hh = h % 12 || 12;
    return `${hh}:${String(m).padStart(2, "0")} ${ampm}`;
  }

  // RENDER LOGIC (Available & Closed)
  function renderAllItems() {
    const root = document.getElementById("menuRoot");
    root.innerHTML = "";
    
    const query = searchInput.value.trim().toLowerCase();

    // 1. Classify Items
    let availableData = []; // { hotelName, item }
    let closedData = [];    // { hotelName, item }

    menuCategories.forEach(cat => {
      (cat.items || []).forEach(item => {
        if (String(item.name || "").toLowerCase().includes(query)) {
          if (isItemAvailable(item)) {
            availableData.push({ hotelName: cat.name, item });
          } else {
            closedData.push({ hotelName: cat.name, item });
          }
        }
      });
    });

    // 2. Render Available Section
    if (availableData.length > 0) {
      let html = `<div class="section-header">🟢 Available Now <span>${availableData.length} items</span></div>`;
      
      // Group by Hotel
      let availHotels = [...new Set(availableData.map(d => d.hotelName))];
      availHotels.forEach(hotel => {
        html += `<div class="hotel-name-tag">🏨 ${hotel}</div>`;
        html += `<div class="menu-container">`;
        
        availableData.filter(d => d.hotelName === hotel).forEach(data => {
          html += createCardHtml(data.item, true);
        });
        
        html += `</div>`;
      });
      root.innerHTML += html;
    }

    // 3. Render Closed Section
    if (closedData.length > 0) {
      let html = `<div class="section-header" style="color:#666;">🔴 Currently Closed <span style="background:#ccc;">${closedData.length} items</span></div>`;
      
      // Group by Hotel
      let closedHotels = [...new Set(closedData.map(d => d.hotelName))];
      closedHotels.forEach(hotel => {
        html += `<div class="hotel-name-tag" style="color:#888;">🏨 ${hotel}</div>`;
        html += `<div class="menu-container">`;
        
        closedData.filter(d => d.hotelName === hotel).forEach(data => {
          html += createCardHtml(data.item, false);
        });
        
        html += `</div>`;
      });
      root.innerHTML += html;
    }

    // 4. No Items Found
    if (availableData.length === 0 && closedData.length === 0) {
      root.innerHTML = `<div class="empty-state">
        <h2 style="font-size:1.3rem; margin-bottom:5px;">😕 Koi Item Nahi Mila</h2>
        <p style="font-size:0.9rem;">Kripya kuch aur search karein.</p>
      </div>`;
    }
  }

  // Helper: Card HTML banane ke liye
  function createCardHtml(item, isAvail) {
    let timeBadge = (item.from || item.to) ? `<span class="card-time-badge ${isAvail ? '' : 'closed-badge'}">🕒 ${formatTime12(item.from)} - ${formatTime12(item.to)}</span>` : "";
    
    let btnHtml = isAvail 
      ? `<button class="buy-action-btn" onclick="openQtyPopup('${item.name}', ${item.price}, '${item.image}')">BUY NOW</button>`
      : `<button class="buy-action-btn closed">CLOSED</button>`;

    return `
      <div class="card ${isAvail ? '' : 'closed'}">
        <div class="card-img-container">
          <img src="${item.image || 'https://via.placeholder.com/280x180?text=No+Image'}" loading="lazy">
          ${timeBadge}
        </div>
        <div class="card-content">
          <h3 class="card-title">${item.name}</h3>
          <p class="card-price">${Number(item.price) || 0}</p>
          ${btnHtml}
        </div>
      </div>`;
  }

  // Popup Logic
  window.openQtyPopup = function(name, price, image) {
    selectedItem = { name, price };
    selectedQty = 1;
    document.getElementById("qtyPopupImg").src = image;
    document.getElementById("qtyPopupTitle").textContent = name;
    document.getElementById("qtyPopupPrice").textContent = `₹${price}`;
    document.getElementById("qtyPopupNum").textContent = selectedQty;
    document.getElementById("qtyModal").classList.add("active");
  };

  window.changePopupQty = function(change) {
    if (selectedQty + change >= 1) {
      selectedQty += change;
      document.getElementById("qtyPopupNum").textContent = selectedQty;
    }
  };

  window.closeQtyModal = () => document.getElementById("qtyModal").classList.remove("active");
  window.closeModal = () => document.getElementById("checkoutModal").classList.remove("active");
  window.closeTrackModal = () => document.getElementById("trackModal").classList.remove("active");
  window.openTrackModal = () => document.getElementById("trackModal").classList.add("active");

  // Direct Buy
  window.directBuy = function() {
    closeQtyModal();
    const itemTotal = selectedItem.price * selectedQty;
    const grandTotal = itemTotal + DELIVERY_CHARGE;
    
    document.getElementById("checkoutItemName").textContent = `${selectedItem.name} (x${selectedQty})`;
    document.getElementById("checkoutItemTotal").textContent = `₹${grandTotal}`;
    
    document.getElementById("checkoutModal").classList.add("active");
    detectLocation();
  };

  // Auto Location
  function detectLocation() {
    const addr = document.getElementById("custAddress");
    addr.value = "Detecting location...";
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => { addr.value = `GPS: ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`; },
        () => { addr.value = "Location Denied! Turn on GPS."; }
      );
    }
  }

  // Place Order & WhatsApp Redirect
  window.placeOrder = function(event) {
    event.preventDefault();
    const name = document.getElementById("custName").value;
    const phone = document.getElementById("custPhone").value;
    const address = document.getElementById("custAddress").value;
    const payment = document.getElementById("paymentMethod").value;

    if(address.includes("Denied") || address.includes("Detecting")) {
      return alert("Please allow GPS location to place order.");
    }

    const itemTotal = selectedItem.price * selectedQty;
    const grandTotal = itemTotal + DELIVERY_CHARGE;

    let orderData = { name, phone, address, status: "pending", item: selectedItem.name, qty: selectedQty };
    localStorage.setItem(`order_${phone}`, JSON.stringify(orderData));

    let msg = `*NEW ORDER - BASVAKALYAN MART*%0A%0A`;
    msg += `*Customer:* ${name}%0A`;
    msg += `*Phone:* ${phone}%0A`;
    msg += `*Loc:* ${address}%0A%0A`;
    msg += `*Item:* ${selectedItem.name} (x${selectedQty})%0A`;
    msg += `*Total:* ₹${grandTotal} (Incl. ₹10 Delivery)%0A`;
    msg += `*Payment:* ${payment}%0A%0A`;
    msg += `*Order ID:* ORD-${phone.slice(-4)}`;

    window.location.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`;
    
    closeModal();
    showToast("Order Placed Successfully!");
  };

  // Check Order Status
  window.checkStatus = function() {
    const phone = document.getElementById("trackPhone").value;
    const data = localStorage.getItem(`order_${phone}`);
    
    if(!data) {
      return alert("Is number par koi order nahi mila.");
    }

    const order = JSON.parse(data);
    document.getElementById("statusTracker").style.display = "flex";
    
    document.getElementById("step-pending").classList.remove("active");
    document.getElementById("step-arriving").classList.remove("active");
    document.getElementById("step-delivered").classList.remove("active");

    if(order.status === "pending") {
      document.getElementById("step-pending").classList.add("active");
    } else if(order.status === "arriving") {
      document.getElementById("step-pending").classList.add("active");
      document.getElementById("step-arriving").classList.add("active");
    } else if(order.status === "delivered") {
      document.getElementById("step-pending").classList.add("active");
      document.getElementById("step-arriving").classList.add("active");
      document.getElementById("step-delivered").classList.add("active");
    }
  };

  // Toast
  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 3000);
  }

  searchInput.addEventListener("input", renderAllItems);
  
  // Auto refresh every 1 min
  setInterval(renderAllItems, 60000); 

  loadMenu();
</script>
</body>
</html>
