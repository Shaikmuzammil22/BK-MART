<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BK MART · Biryani House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Same CSS as before */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, sans-serif; }
    body { background: #f7f4f0; color: #1e1e1e; padding-bottom: 60px; }
    .header { background: linear-gradient(135deg, #ffffff 0%, #fefbf8 100%); padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 200; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04); border-bottom: 1px solid rgba(139, 69, 19, 0.08); }
    .brand h1 { font-size: 2.2rem; font-weight: 800; background: linear-gradient(145deg, #8B4513 0%, #b85e1a 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1.1; }
    .brand p { font-size: 0.9rem; font-weight: 500; color: #8b6b4d; }
    .search-container { max-width: 900px; margin: 20px auto 10px; padding: 0 20px; }
    .search-box { display: flex; align-items: center; background: white; border: 1px solid #ede6de; border-radius: 60px; padding: 12px 22px; }
    .search-box input { border: none; outline: none; width: 100%; font-size: 1rem; margin-left: 12px; background: transparent; }
    .alert-closed { max-width: 900px; margin: 0 auto 16px; background: #fff1f0; color: #b3402c; padding: 16px 24px; border-radius: 60px; text-align: center; font-weight: 700; display: none; }
    .menu-container { max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 26px; }
    .card { background: #ffffff; border-radius: 28px; overflow: hidden; box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.06); display: flex; flex-direction: column; border: 1px solid #f3ede8; }
    .card-img-container { position: relative; width: 100%; height: 190px; background: #efe8e0; }
    .card-img-container img { width: 100%; height: 100%; object-fit: cover; }
    .card-content { padding: 18px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { font-size: 1.2rem; font-weight: 700; color: #2c1d12; margin-bottom: 4px; }
    .card-price { font-size: 1.1rem; color: #b85e1a; font-weight: 800; margin-bottom: 16px; }
    .card-price::before { content: "₹"; font-weight: 700; margin-right: 2px; }
    .buy-btn { margin-top: auto; background: linear-gradient(145deg, #ff6a2b, #e0530e); color: white; border: none; padding: 14px; border-radius: 50px; font-weight: 700; cursor: pointer; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(20, 15, 10, 0.7); z-index: 1000; justify-content: center; align-items: center; padding: 16px; }
    .modal.active { display: flex; }
    .modal-content { background: #ffffff; width: 100%; max-width: 460px; border-radius: 32px; padding: 28px; max-height: 92vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid #f0e6de; padding-bottom: 14px; }
    .close-btn { background: none; border: none; font-size: 2rem; cursor: pointer; color: #a78b7a; }
    #orderSummary { margin-bottom: 22px; background: #fdf8f4; padding: 16px; border-radius: 20px; border-left: 6px solid #b85e1a; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; color: #5f4b3a; }
    .form-group input, .form-group textarea { width: 100%; padding: 14px; border: 1px solid #e2d8d0; border-radius: 18px; font-family: inherit; font-size: 0.95rem; }
    .payment-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
    .pay-label { display: flex; align-items: center; padding: 15px 18px; border: 1.5px solid #ede6de; border-radius: 18px; cursor: pointer; font-weight: 600; background: #fefcfb; }
    .qr-section { display: none; text-align: center; margin: 16px 0; padding: 20px; background: #fdf8f4; border-radius: 22px; border: 1px dashed #dbbd9c; }
    .qr-section img { width: 180px; height: 180px; margin-top: 10px; border-radius: 10px; }
    .place-order-btn { width: 100%; background: #1e7b3c; color: white; padding: 18px; border: none; border-radius: 50px; font-size: 1.1rem; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>

<div class="header">
  <div class="brand">
    <h1>BK MART</h1>
    <p>🍛 Biryani House · <i>★★★★★</i> 4.5</p>
  </div>
</div>

<div class="search-container">
  <div class="search-box">
    <span>🔍</span>
    <input type="text" id="searchInput" placeholder="Search Biryani, Dosa...">
  </div>
</div>

<div id="shopAlert" class="alert-closed">⚠️ Aaj Dukan Band Hai (Shop Closed for Holiday)</div>

<div class="menu-container" id="menuGrid"></div>

<!-- CHECKOUT MODAL -->
<div class="modal" id="checkoutModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Checkout</h2>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>

    <div id="orderSummary"></div>

    <form id="checkoutForm" onsubmit="placeOrder(event)">
      <div class="form-group">
        <label>Your Name</label>
        <input type="text" id="custName" required placeholder="Full name">
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="custPhone" required placeholder="10-digit mobile">
      </div>
      <div class="form-group">
        <label>Delivery Address (Auto-detect ho raha hai...)</label>
        <textarea id="custAddress" required rows="2" placeholder="Location fetch ho rahi hai..."></textarea>
      </div>

      <label style="font-weight: 700; margin-bottom: 10px; display: block;">Payment Method</label>
      <div class="payment-options">
        <label class="pay-label">
          <input type="radio" name="payment" value="UPI" onclick="toggleQR(true)" checked>
          📱 UPI (GPay / PhonePe / Paytm)
        </label>
        <label class="pay-label">
          <input type="radio" name="payment" value="COD" onclick="toggleQR(false)">
          💵 Cash on Delivery
        </label>
      </div>

      <!-- QR SECTION WITH AUTO GENERATE -->
      <div class="qr-section" id="qrSection">
        <p>Scan QR to Pay (Auto Generate)</p>
        <img id="qrImage" src="" alt="UPI QR">
        <p style="margin-top:10px; font-size:0.8rem; color:#777;">UPI ID: <b>9353481235@axl</b></p>
        
        <div class="payment-options" style="margin-top: 15px;">
          <button type="button" class="pay-label" onclick="payWithApp('phonepe')">🟣 PhonePe</button>
          <button type="button" class="pay-label" onclick="payWithApp('paytm')">🔵 Paytm</button>
          <button type="button" class="pay-label" onclick="payWithApp('gpay')">🟢 Google Pay</button>
        </div>
      </div>

      <button type="submit" class="place-order-btn">Place Order · Pay Now</button>
    </form>
  </div>
</div>

<script>
  // ==========================================
  // ✅ NEW SETTINGS: Number & UPI
  // ==========================================
  const WHATSAPP_NUMBER = "919353481235"; 
  const UPI_ID = "9353481235@axl"; // Space hatakar sahi format
  const PAYEE_NAME = "BK MART";

  let shopOpen = true;
  let currentItem = null;
  let allMenuItems = [];

  const searchInput = document.getElementById("searchInput");
  const shopAlert = document.getElementById("shopAlert");

  const masterMenu = [
    { name: "Idli (4 pcs)", price: 40, image: "https://images.unsplash.com/photo-1589301760014-d929f3979dbc?q=80&w=600&auto=format&fit=crop" },
    { name: "Plain Dosa", price: 50, image: "https://images.unsplash.com/photo-1630383249896-424e482df921?q=80&w=600&auto=format&fit=crop" },
    { name: "Masala Dosa", price: 70, image: "https://images.unsplash.com/photo-1668236543090-82eba5ee5976?q=80&w=600&auto=format&fit=crop" },
    { name: "Medu Vada", price: 30, image: "https://images.unsplash.com/photo-1626509653291-18d9a934b9db?q=80&w=600&auto=format&fit=crop" },
    { name: "Tahari", price: 90, image: "https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?q=80&w=600&auto=format&fit=crop" },
    { name: "Chicken Biryani", price: 180, image: "https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?q=80&w=600&auto=format&fit=crop" },
    { name: "Mutton Biryani", price: 250, image: "https://images.unsplash.com/photo-1589302168068-964664d93dc0?q=80&w=600&auto=format&fit=crop" },
    { name: "Veg Biryani", price: 140, image: "https://images.unsplash.com/photo-1596797038530-2c107229654b?q=80&w=600&auto=format&fit=crop" },
    { name: "Shami Parata", price: 120, image: "https://images.unsplash.com/photo-1626074353765-517a681e40be?q=80&w=600&auto=format&fit=crop" },
    { name: "Egg Dosa", price: 80, image: "https://images.unsplash.com/photo-1551218808-94e220e084d2?q=80&w=600&auto=format&fit=crop" }
  ];

  function renderMenu(items) {
    const grid = document.getElementById("menuGrid");
    grid.innerHTML = "";
    const query = searchInput.value.trim().toLowerCase();
    let categories = window.menuCategories || [{name:"BK MART", items: items}];
    let found = 0;

    categories.forEach(category => {
      const matches = (category.items || []).filter(item => String(item.name || "").toLowerCase().includes(query));
      if (!matches.length) return;
      found += matches.length;

      matches.forEach(item => {
        const div = document.createElement("div");
        div.className = "card";
        const imgSrc = item.image || "https://via.placeholder.com/280x180?text=No+Image";
        div.innerHTML = `
          <div class="card-img-container"><img src="${imgSrc}"></div>
          <div class="card-content">
            <h3 class="card-title">${item.name}</h3>
            <p class="card-price">${Number(item.price)||0}</p>
            <button class="buy-btn">BUY NOW</button>
          </div>`;
        div.querySelector(".buy-btn").addEventListener("click", () => openCheckout(item.name, Number(item.price)||0));
        grid.appendChild(div);
      });
    });
    if (!found) grid.innerHTML = "<p style='grid-column:1/-1;text-align:center;padding:35px'>No items found.</p>";
  }

  async function loadMenu() {
    try {
      const response = await fetch('data.json?v=' + Date.now());
      if (!response.ok) throw new Error();
      const data = await response.json();
      shopOpen = data.shopStatus !== "closed";
      shopAlert.style.display = shopOpen ? "none" : "block";
      if (Array.isArray(data.categories) && data.categories.length) {
        window.menuCategories = data.categories;
        allMenuItems = data.categories.flatMap(c => c.items || []);
      } else {
        window.menuCategories = [{name:"BK MART",items:data.menu||[]}];
        allMenuItems = window.menuCategories[0].items;
      }
    } catch (e) {
      window.menuCategories = [{name:"BK MART",items:masterMenu}];
      allMenuItems = masterMenu;
      shopAlert.style.display = "none";
    }
    renderMenu(allMenuItems);
  }

  searchInput.addEventListener("input", () => renderMenu(allMenuItems));

  // ==========================================
  // ✅ AUTO DETECT LOCATION
  // ==========================================
  function detectLocation() {
    const addressField = document.getElementById("custAddress");
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          // Yahan hum coordinates dikha rahe hain, kyunki Google Maps API ke bina naam nahi mil sakta
          addressField.value = `Lat: ${position.coords.latitude}, Lng: ${position.coords.longitude} (Please add house details)`;
        },
        (error) => {
          addressField.placeholder = "Location denied. Please type address manually.";
        }
      );
    }
  }

  // ==========================================
  // ✅ AUTO GENERATE QR
  // ==========================================
  function generateQR(amount) {
    const upiUrl = `upi://pay?pa=${UPI_ID}&pn=${encodeURIComponent(PAYEE_NAME)}&am=${amount}&cu=INR`;
    // Online API use kar rahe hain QR banane ke liye
    const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(upiUrl)}`;
    document.getElementById("qrImage").src = qrApiUrl;
  }

  window.openCheckout = function(name, price) {
    if (!shopOpen) return alert("Shop is closed today.");
    currentItem = { name, price };
    document.getElementById("orderSummary").innerHTML = `<h4>${name}</h4><p>₹${price}</p>`;
    
    // Open Modal
    document.getElementById("checkoutModal").classList.add("active");
    
    // Generate QR & Detect Location
    generateQR(price);
    detectLocation();
  };

  window.closeModal = function() {
    document.getElementById("checkoutModal").classList.remove("active");
    document.getElementById("checkoutForm").reset();
    document.getElementById("qrImage").src = "";
  };

  window.toggleQR = function(show) {
    document.getElementById("qrSection").style.display = show ? "block" : "none";
  };

  // ==========================================
  // ✅ AUTO REDIRECT TO UPI APPS
  // ==========================================
  window.payWithApp = function(app) {
    if (!currentItem) return;
    
    const params = new URLSearchParams({
      pa: UPI_ID, 
      pn: PAYEE_NAME, 
      am: String(currentItem.price), 
      cu: 'INR', 
      tn: `Order - ${currentItem.name}`
    });
    const query = params.toString();
    
    const links = {
      phonepe: `phonepe://pay?${query}`,
      paytm: `paytmmp://pay?${query}`,
      gpay: `tez://upi/pay?${query}`
    };
    
    // Redirect to app
    window.location.href = links[app];
  };

  // ==========================================
  // ✅ WHATSAPP PLACE ORDER
  // ==========================================
  window.placeOrder = function(event) {
    event.preventDefault();
    const name = document.getElementById("custName").value;
    const phone = document.getElementById("custPhone").value;
    const address = document.getElementById("custAddress").value;
    const paymentMethod = document.querySelector('input[name="payment"]:checked').value;

    let message = `*New Order - BK MART*%0A%0A`;
    message += `*Item:* ${currentItem.name}%0A`;
    message += `*Price:* ₹${currentItem.price}%0A`;
    message += `*Payment:* ${paymentMethod}%0A%0A`;
    message += `*Customer Details:*%0A`;
    message += `Name: ${name}%0A`;
    message += `Phone: ${phone}%0A`;
    message += `Address: ${address}`;

    const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;
    window.location.href = whatsappUrl;
  };

  loadMenu();
</script>
</body>
</html>
