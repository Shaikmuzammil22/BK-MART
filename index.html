<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BK MART · Biryani House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, sans-serif; }
    body { background: #f7f4f0; color: #1e1e1e; padding-bottom: 60px; }

    /* ── PREMIUM HEADER ── */
    .header { background: linear-gradient(135deg, #ffffff 0%, #fefbf8 100%); padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 200; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04); border-bottom: 1px solid rgba(139, 69, 19, 0.08); }
    .brand h1 { font-size: 2.2rem; font-weight: 800; background: linear-gradient(145deg, #8B4513 0%, #b85e1a 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1.1; }
    .brand .hotel-sub { font-size: 0.85rem; font-weight: 600; color: #b85e1a; margin-top: 4px; display: flex; align-items: center; gap: 8px; }
    .brand .hotel-sub .badge { background: linear-gradient(145deg, #ff6a2b, #e0530e); color: #fff; font-size: 0.7rem; padding: 3px 10px; border-radius: 20px; font-weight: 700; letter-spacing: .3px; box-shadow: 0 3px 8px rgba(224,83,14,0.3); }
    .brand p { font-size: 0.85rem; font-weight: 500; color: #8b6b4d; margin-top: 2px; }

    /* ── SEARCH ── */
    .search-container { max-width: 900px; margin: 20px auto 10px; padding: 0 20px; }
    .search-box { display: flex; align-items: center; background: white; border: 1px solid #ede6de; border-radius: 60px; padding: 12px 22px; box-shadow: 0 4px 16px rgba(0,0,0,0.03); transition: box-shadow .2s, border .2s; }
    .search-box:focus-within { box-shadow: 0 4px 24px rgba(184,94,26,0.15); border-color: #dbbd9c; }
    .search-box input { border: none; outline: none; width: 100%; font-size: 1rem; margin-left: 12px; background: transparent; }

    /* ── ALERTS ── */
    .alert-closed { max-width: 900px; margin: 0 auto 16px; background: #fff1f0; color: #b3402c; padding: 16px 24px; border-radius: 60px; text-align: center; font-weight: 700; display: none; }
    .alert-time { max-width: 900px; margin: 0 auto 16px; background: #fff8e6; color: #9a6b00; padding: 14px 24px; border-radius: 60px; text-align: center; font-weight: 600; font-size: .85rem; display: none; }

    /* ── MENU GRID ── */
    .menu-container { max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 26px; }
    .card { background: #ffffff; border-radius: 28px; overflow: hidden; box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.06); display: flex; flex-direction: column; border: 1px solid #f3ede8; transition: transform .2s, box-shadow .2s; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -12px rgba(0,0,0,0.1); }
    .card-img-container { position: relative; width: 100%; height: 190px; background: #efe8e0; }
    .card-img-container img { width: 100%; height: 100%; object-fit: cover; }
    .card-time-badge { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,.6); color: #fff; font-size: .7rem; font-weight: 700; padding: 5px 12px; border-radius: 20px; backdrop-filter: blur(6px); letter-spacing: .3px; }
    .card-content { padding: 18px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { font-size: 1.2rem; font-weight: 700; color: #2c1d12; margin-bottom: 4px; }
    .card-price { font-size: 1.1rem; color: #b85e1a; font-weight: 800; margin-bottom: 16px; }
    .card-price::before { content: "₹"; font-weight: 700; margin-right: 2px; }

    /* ── PREMIUM BUY BUTTON ── */
    .buy-btn {
      margin-top: auto;
      background: linear-gradient(145deg, #ff7a2b 0%, #e0530e 100%);
      color: white; border: none; padding: 15px; border-radius: 50px;
      font-weight: 800; cursor: pointer; font-size: 1rem; letter-spacing: .3px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all .25s; box-shadow: 0 8px 20px -4px rgba(224,83,14,0.45);
      position: relative; overflow: hidden;
    }
    .buy-btn::after { content: ""; position: absolute; inset: 0; background: linear-gradient(145deg, rgba(255,255,255,.25), transparent); opacity: 0; transition: opacity .25s; }
    .buy-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px -4px rgba(224,83,14,0.6); }
    .buy-btn:hover::after { opacity: 1; }
    .buy-btn:active { transform: scale(.97); }
    .buy-btn .btn-icon { font-size: 1.15rem; }

    /* ── MODAL ── */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(20, 15, 10, 0.7); z-index: 1000; justify-content: center; align-items: center; padding: 16px; backdrop-filter: blur(4px); }
    .modal.active { display: flex; }
    .modal-content { background: #ffffff; width: 100%; max-width: 460px; border-radius: 32px; padding: 28px; max-height: 92vh; overflow-y: auto; animation: modalIn .25s ease; }
    @keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid #f0e6de; padding-bottom: 14px; }
    .modal-header h2 { font-size: 1.4rem; font-weight: 800; color: #2c1d12; }
    .close-btn { background: none; border: none; font-size: 2rem; cursor: pointer; color: #a78b7a; line-height: 1; transition: color .2s; }
    .close-btn:hover { color: #b85e1a; }
    #orderSummary { margin-bottom: 22px; background: #fdf8f4; padding: 16px; border-radius: 20px; border-left: 6px solid #b85e1a; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; color: #5f4b3a; }
    .form-group input, .form-group textarea { width: 100%; padding: 14px; border: 1px solid #e2d8d0; border-radius: 18px; font-family: inherit; font-size: 0.95rem; transition: border .2s, box-shadow .2s; }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #b85e1a; box-shadow: 0 0 0 3px rgba(184,94,26,0.12); }

    /* ── PAYMENT OPTIONS ── */
    .payment-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
    .pay-label { display: flex; align-items: center; padding: 15px 18px; border: 1.5px solid #ede6de; border-radius: 18px; cursor: pointer; font-weight: 600; background: #fefcfb; transition: all .2s; gap: 8px; }
    .pay-label:hover { border-color: #dbbd9c; background: #fffaf6; }
    .pay-label:has(input:checked) { border-color: #b85e1a; background: #fdf2e9; box-shadow: 0 0 0 3px rgba(184,94,26,0.1); }

    /* ── QR & APP BUTTONS ── */
    .qr-section { display: none; text-align: center; margin: 16px 0; padding: 20px; background: #fdf8f4; border-radius: 22px; border: 1px dashed #dbbd9c; }
    .qr-section img#qrImage { width: 180px; height: 180px; margin-top: 10px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    
    .app-pay-btn {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 12px; border: 1.5px solid #ede6de; border-radius: 18px;
      background: #fff; cursor: pointer; transition: all .2s;
      font-size: 1rem; font-weight: 700; color: #333; width: 100%;
    }
    .app-pay-btn:hover { border-color: #b85e1a; background: #fffaf6; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,.06); }
    .app-pay-btn:active { transform: scale(.98); }
    .app-logo { height: 24px; width: auto; object-fit: contain; display: block; }

    /* ── PREMIUM PLACE ORDER BUTTON ── */
    .place-order-btn {
      width: 100%;
      background: linear-gradient(145deg, #1e9e4a 0%, #157a36 100%);
      color: white; padding: 18px; border: none; border-radius: 50px;
      font-size: 1.1rem; font-weight: 800; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: all .25s; box-shadow: 0 8px 24px -4px rgba(21,122,54,0.45);
      letter-spacing: .3px; position: relative; overflow: hidden;
    }
    .place-order-btn::after { content: ""; position: absolute; inset: 0; background: linear-gradient(145deg, rgba(255,255,255,.2), transparent); opacity: 0; transition: opacity .25s; }
    .place-order-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 32px -4px rgba(21,122,54,0.6); }
    .place-order-btn:hover::after { opacity: 1; }
    .place-order-btn:active { transform: scale(.98); }
    .place-order-btn .btn-icon { font-size: 1.3rem; }
  </style>
</head>

  function isItemAvailable(item) {
    if (!item.from && !item.to) return true;
    const now = new Date();
    const cur = now.getHours() * 60 + now.getMinutes();
    function toMin(t) {
      if (!t) return null;
      const [h, m] = t.split(":").map(Number);
      return h * 60 + (m || 0);
    }
    const f = toMin(item.from);
    const t = toMin(item.to);
    if (f === null && t === null) return true;
    if (f === null) return cur <= t;
    if (t === null) return cur >= f;
    if (f <= t) return cur >= f && cur <= t;
    return cur >= f || cur <= t;
  }

  function formatTime12(t) {
    if (!t) return "";
    const [h, m] = t.split(":").map(Number);
    const ampm = h >= 12 ? "PM" : "AM";
    const hh = h % 12 || 12;
    return `${hh}:${String(m).padStart(2, "0")} ${ampm}`;
  }

    let totalVisible = 0;

    const categories = menuCategories.length ? menuCategories : [{ name: "BK MART", items }];

    categories.forEach(category => {
      const matches = (category.items || []).filter(item =>
        String(item.name || "").toLowerCase().includes(query) && isItemAvailable(item)
      );
      if (!matches.length) return;
      found += matches.length;

      matches.forEach(item => {

        const div = document.createElement("div");
        div.className = "card";
        const imgSrc = item.image || "https://via.placeholder.com/280x180?text=No+Image";

          ? `<span class="card-time-badge">🕒 ${formatTime12(item.from) || "—"} – ${formatTime12(item.to) || "—"}</span>`
          : "";
        div.innerHTML = `
          <div class="card-img-container">
            <img src="${imgSrc}">
            ${timeBadge}
          </div>
          <div class="card-content">
            <h3 class="card-title">${item.name}</h3>
            <p class="card-price">${Number(item.price) || 0}</p>
            <button class="buy-btn"><span class="btn-icon">🛍️</span> BUY NOW</button>
          </div>`;
        div.querySelector(".buy-btn").addEventListener("click", () => openCheckout(item.name, Number(item.price) || 0));
        grid.appendChild(div);
      });
    });

    document.getElementById("productCount").textContent = totalVisible + " items";

    if (!found) {
      grid.innerHTML = "<p style='grid-column:1/-1;text-align:center;padding:35px;color:#888'>No items found.</p>";
    }

    const totalAll = categories.reduce((s, c) => s + (c.items || []).length, 0);
    const availableCount = categories.reduce((s, c) => s + (c.items || []).filter(isItemAvailable).length, 0);
    timeAlert.style.display = (totalAll > 0 && availableCount === 0) ? "block" : "none";
  }

  // ── LOAD ──
  async function loadMenu() {
    try {
      const response = await fetch('data.json?v=' + Date.now());
      if (!response.ok) throw new Error();
      const data = await response.json();

      shopOpen = data.shopStatus !== "closed";
      shopAlert.style.display = shopOpen ? "none" : "block";

      if (data.upi) {
        globalUpi = {
          id: data.upi.id || DEFAULT_UPI_ID,
          name: data.upi.name || PAYEE_NAME,
          enabled: data.upi.enabled !== false
        };
      }
      if (data.hotelName) document.getElementById("hotelName").textContent = data.hotelName;
      if (data.hotelSubtitle) document.getElementById("hotelSubtitle").textContent = data.hotelSubtitle;

      if (Array.isArray(data.categories) && data.categories.length) {
        menuCategories = data.categories;
        allMenuItems = data.categories.flatMap(c => c.items || []);
      } else {
        menuCategories = [{ name: data.hotelName || "BK MART", items: data.menu || [] }];
        allMenuItems = menuCategories[0].items;
      }
    } catch (e) {
      menuCategories = [{ name: "BK MART", items: masterMenu }];
      allMenuItems = masterMenu;
      shopAlert.style.display = "none";
    }
    document.getElementById("upiIdDisplay").textContent = globalUpi.id;
    renderMenu(allMenuItems);
  }

  searchInput.addEventListener("input", () => renderMenu(allMenuItems));
  setInterval(() => renderMenu(allMenuItems), 30000);

  // ── LOCATION ──
  function detectLocation() {
    const addressField = document.getElementById("custAddress");
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          addressField.value = `Lat: ${position.coords.latitude}, Lng: ${position.coords.longitude} (Please add house details)`;
        },
        () => { addressField.placeholder = "Location denied. Please type address manually."; }
      );
    }
  }

      </div>
      <div class="form-group">

  // ==========================================
  // ✅ SETTINGS
  // ==========================================
  const WHATSAPP_NUMBER = "919353481235";
  const DEFAULT_UPI_ID = "9353481235@axl";
  const PAYEE_NAME = "BK MART";

  let shopOpen = true;
  let currentItem = null;
  let allMenuItems = [];
  let menuCategories = [];
  let globalUpi = { id: DEFAULT_UPI_ID, name: PAYEE_NAME, enabled: true };

  const searchInput = document.getElementById("searchInput");
  const shopAlert = document.getElementById("shopAlert");
  const timeAlert = document.getElementById("timeAlert");

  const masterMenu = [
    { name: "Idli (4 pcs)", price: 40, image: "https://images.unsplash.com/photo-1589301760014-d929f3979dbc?q=80&w=600&auto=format&fit=crop", from: "06:00", to: "11:00" },
    { name: "Plain Dosa", price: 50, image: "https://images.unsplash.com/photo-1630383249896-424e482df921?q=80&w=600&auto=format&fit=crop", from: "06:00", to: "11:00" },
    { name: "Masala Dosa", price: 70, image: "https://images.unsplash.com/photo-1668236543090-82eba5ee5976?q=80&w=600&auto=format&fit=crop", from: "06:00", to: "11:00" },
    { name: "Medu Vada", price: 30, image: "https://images.unsplash.com/photo-1626509653291-18d9a934b9db?q=80&w=600&auto=format&fit=crop", from: "06:00", to: "11:00" },
    { name: "Tahari", price: 90, image: "https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?q=80&w=600&auto=format&fit=crop", from: "11:00", to: "23:59" },
    { name: "Chicken Biryani", price: 180, image: "https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?q=80&w=600&auto=format&fit=crop", from: "11:00", to: "23:59" },
    { name: "Mutton Biryani", price: 250, image: "https://images.unsplash.com/photo-1589302168068-964664d93dc0?q=80&w=600&auto=format&fit=crop", from: "11:00", to: "23:59" },
    { name: "Veg Biryani", price: 140, image: "https://images.unsplash.com/photo-1596797038530-2c107229654b?q=80&w=600&auto=format&fit=crop", from: "11:00", to: "23:59" },
    { name: "Shami Parata", price: 120, image: "https://images.unsplash.com/photo-1626074353765-517a681e40be?q=80&w=600&auto=format&fit=crop", from: "06:00", to: "11:00" },
    { name: "Egg Dosa", price: 80, image: "https://images.unsplash.com/photo-1551218808-94e220e084d2?q=80&w=600&auto=format&fit=crop", from: "06:00", to: "11:00" }
  ];

  // ── TIME WINDOW ──
  function isItemAvailable(item) {
    if (!item.from && !item.to) return true;
    const now = new Date();
    const cur = now.getHours() * 60 + now.getMinutes();
    function toMin(t) {
      if (!t) return null;
      const [h, m] = t.split(":").map(Number);
      return h * 60 + (m || 0);
    }
    const f = toMin(item.from);
    const t = toMin(item.to);
    if (f === null && t === null) return true;
    if (f === null) return cur <= t;
    if (t === null) return cur >= f;
    if (f <= t) return cur >= f && cur <= t;
    return cur >= f || cur <= t;
  }

  function formatTime12(t) {
    if (!t) return "";
    const [h, m] = t.split(":").map(Number);
    const ampm = h >= 12 ? "PM" : "AM";
    const hh = h % 12 || 12;
    return `${hh}:${String(m).padStart(2, "0")} ${ampm}`;
  }

  // ── RENDER ──
  function renderMenu(items) {
    const grid = document.getElementById("menuGrid");
    grid.innerHTML = "";
    const query = searchInput.value.trim().toLowerCase();
    let found = 0;
    let totalVisible = 0;

    const categories = menuCategories.length ? menuCategories : [{ name: "BK MART", items }];

    categories.forEach(category => {
      const matches = (category.items || []).filter(item =>
        String(item.name || "").toLowerCase().includes(query) && isItemAvailable(item)
      );
      if (!matches.length) return;
      found += matches.length;

      matches.forEach(item => {
        totalVisible++;
        const div = document.createElement("div");
        div.className = "card";
        const imgSrc = item.image || "https://via.placeholder.com/280x180?text=No+Image";
        const timeBadge = (item.from || item.to)
          ? `<span class="card-time-badge">🕒 ${formatTime12(item.from) || "—"} – ${formatTime12(item.to) || "—"}</span>`
          : "";
        div.innerHTML = `
          <div class="card-img-container">
            <img src="${imgSrc}">
            ${timeBadge}
          </div>
          <div class="card-content">
            <h3 class="card-title">${item.name}</h3>
            <p class="card-price">${Number(item.price) || 0}</p>
            <button class="buy-btn"><span class="btn-icon">🛍️</span> BUY NOW</button>
          </div>`;
        div.querySelector(".buy-btn").addEventListener("click", () => openCheckout(item.name, Number(item.price) || 0));
        grid.appendChild(div);
      });
    });

    document.getElementById("productCount").textContent = totalVisible + " items";

    if (!found) {
      grid.innerHTML = "<p style='grid-column:1/-1;text-align:center;padding:35px;color:#888'>No items found.</p>";
    }

    const totalAll = categories.reduce((s, c) => s + (c.items || []).length, 0);
    const availableCount = categories.reduce((s, c) => s + (c.items || []).filter(isItemAvailable).length, 0);
    timeAlert.style.display = (totalAll > 0 && availableCount === 0) ? "block" : "none";
  }

  // ── LOAD ──
  async function loadMenu() {
    try {
      const response = await fetch('data.json?v=' + Date.now());
      if (!response.ok) throw new Error();
      const data = await response.json();

      shopOpen = data.shopStatus !== "closed";
      shopAlert.style.display = shopOpen ? "none" : "block";

      if (data.upi) {
        globalUpi = {
          id: data.upi.id || DEFAULT_UPI_ID,
          name: data.upi.name || PAYEE_NAME,
          enabled: data.upi.enabled !== false
        };
      }
      if (data.hotelName) document.getElementById("hotelName").textContent = data.hotelName;
      if (data.hotelSubtitle) document.getElementById("hotelSubtitle").textContent = data.hotelSubtitle;

      if (Array.isArray(data.categories) && data.categories.length) {
        menuCategories = data.categories;
        allMenuItems = data.categories.flatMap(c => c.items || []);
      } else {
        menuCategories = [{ name: data.hotelName || "BK MART", items: data.menu || [] }];
        allMenuItems = menuCategories[0].items;
      }
    } catch (e) {
      menuCategories = [{ name: "BK MART", items: masterMenu }];
      allMenuItems = masterMenu;
      shopAlert.style.display = "none";
    }
    document.getElementById("upiIdDisplay").textContent = globalUpi.id;
    renderMenu(allMenuItems);
  }

  searchInput.addEventListener("input", () => renderMenu(allMenuItems));
  setInterval(() => renderMenu(allMenuItems), 30000);

  // ── LOCATION ──
  function detectLocation() {
    const addressField = document.getElementById("custAddress");
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          addressField.value = `Lat: ${position.coords.latitude}, Lng: ${position.coords.longitude} (Please add house details)`;
        },
        () => { addressField.placeholder = "Location denied. Please type address manually."; }
      );
    }
  }

  // ── QR ──
  function generateQR(amount) {
    const upiUrl = `upi://pay?pa=${globalUpi.id}&pn=${encodeURIComponent(globalUpi.name)}&am=${amount}&cu=INR`;
    document.getElementById("qrImage").src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(upiUrl)}`;
  }

  window.openCheckout = function(name, price) {
    if (!shopOpen) return alert("Shop is closed today.");
    currentItem = { name, price };
    document.getElementById("orderSummary").innerHTML = `<h4>${name}</h4><p>₹${price}</p>`;
    document.getElementById("checkoutModal").classList.add("active");
    generateQR(price);
    detectLocation();
  };

  window.closeModal = function() {
    document.getElementById("checkoutModal").classList.remove("active");
    document.getElementById("checkoutForm").reset();
    document.getElementById("qrImage").src = "";
  };

  window.toggleQR = function(show) {
    document.getElementById("qrSection").style.display = show ? "block" : "none";
  };

  window.payWithApp = function(app) {
    if (!currentItem) return;
    const params = new URLSearchParams({
      pa: globalUpi.id, pn: globalUpi.name, am: String(currentItem.price),
      cu: 'INR', tn: `Order - ${currentItem.name}`
    });
    const query = params.toString();
    const links = {
      phonepe: `phonepe://pay?${query}`,
      paytm: `paytmmp://pay?${query}`,
      gpay: `tez://upi/pay?${query}`
    };
    window.location.href = links[app];
  };

  window.placeOrder = function(event) {
    event.preventDefault();
    const name = document.getElementById("custName").value;
    const phone = document.getElementById("custPhone").value;
    const address = document.getElementById("custAddress").value;
    const paymentMethod = document.querySelector('input[name="payment"]:checked').value;

    let message = `*New Order - ${globalUpi.name}*%0A%0A`;
    message += `*Item:* ${currentItem.name}%0A`;
    message += `*Price:* ₹${currentItem.price}%0A`;
    message += `*Payment:* ${paymentMethod}%0A%0A`;
    message += `*Customer Details:*%0A`;
    message += `Name: ${name}%0A`;
    message += `Phone: ${phone}%0A`;
    message += `Address: ${address}`;

    window.location.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;
  };

  loadMenu();
</script>
</body>
</html>
