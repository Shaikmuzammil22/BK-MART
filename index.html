<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BK MART · Biryani House</title>
  <!-- Google Fonts for premium feel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ----- RESET & GLOBAL ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, sans-serif;
    }

    body {
      background: #f7f4f0;  /* warm premium background */
      color: #1e1e1e;
      padding-bottom: 60px;
    }

    /* ----- PREMIUM HEADER (big BK MART) ----- */
    .header {
      background: linear-gradient(135deg, #ffffff 0%, #fefbf8 100%);
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
      border-bottom: 1px solid rgba(139, 69, 19, 0.08);
    }

    .brand h1 {
      font-size: 2.2rem;    /* big BK MART */
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(145deg, #8B4513 0%, #b85e1a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
      margin-bottom: 2px;
    }

    .brand p {
      font-size: 0.9rem;
      font-weight: 500;
      color: #8b6b4d;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand p i {
      font-style: normal;
      color: #ffb800;
    }

    /* ----- SEARCH ----- */
    .search-container {
      max-width: 900px;
      margin: 20px auto 10px;
      padding: 0 20px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: white;
      border: 1px solid #ede6de;
      border-radius: 60px;
      padding: 12px 22px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.02);
      transition: 0.2s;
    }

    .search-box:focus-within {
      border-color: #b85e1a;
      box-shadow: 0 6px 20px rgba(184, 94, 26, 0.08);
    }

    .search-box span {
      font-size: 1.2rem;
      opacity: 0.6;
    }

    .search-box input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 1rem;
      margin-left: 12px;
      background: transparent;
      font-weight: 500;
      color: #2c2c2c;
    }

    .search-box input::placeholder {
      color: #b0a69c;
      font-weight: 400;
    }

    /* ----- SHOP CLOSED ALERT (premium) ----- */
    .alert-closed {
      max-width: 900px;
      margin: 0 auto 16px;
      background: #fff1f0;
      color: #b3402c;
      padding: 16px 24px;
      border-radius: 60px;
      text-align: center;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.2px;
      border: 1px solid #ffd9d4;
      box-shadow: 0 4px 12px rgba(179, 64, 44, 0.08);
      display: none;
    }

    /* ----- MENU GRID (premium cards) ----- */
    .menu-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 26px;
    }

    .card {
      background: #ffffff;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.06);
      transition: transform 0.25s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      border: 1px solid #f3ede8;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 24px 40px -12px rgba(139, 69, 19, 0.15);
    }

    .card-img-container {
      position: relative;
      width: 100%;
      height: 190px;
      background: #efe8e0;
    }

    .card-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s;
    }

    .card:hover .card-img-container img {
      transform: scale(1.02);
    }

    .rating-badge {
      position: absolute;
      bottom: 12px;
      left: 14px;
      background: #2d7a2d;
      color: white;
      padding: 5px 12px;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .card-content {
      padding: 18px 18px 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #2c1d12;
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }

    .card-price {
      font-size: 1.1rem;
      color: #b85e1a;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .card-price::before {
      content: "₹";
      font-weight: 700;
      margin-right: 2px;
    }

    /* Buy Button (premium gradient) */
    .buy-btn {
      margin-top: auto;
      background: linear-gradient(145deg, #ff6a2b, #e0530e);
      color: white;
      border: none;
      padding: 14px 18px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 6px 16px rgba(224, 83, 14, 0.25);
    }

    .buy-btn:hover {
      background: linear-gradient(145deg, #e0530e, #c44506);
      box-shadow: 0 8px 22px rgba(224, 83, 14, 0.35);
      transform: scale(1.01);
    }

    /* ----- MODAL (CHECKOUT) premium ----- */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(20, 15, 10, 0.7);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #ffffff;
      width: 100%;
      max-width: 460px;
      border-radius: 32px;
      padding: 28px 24px 24px;
      max-height: 92vh;
      overflow-y: auto;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
      border: 1px solid #f0e6de;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      border-bottom: 1px solid #f0e6de;
      padding-bottom: 14px;
    }

    .modal-header h2 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #2c1d12;
      letter-spacing: -0.5px;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 2rem;
      cursor: pointer;
      color: #a78b7a;
      line-height: 1;
      transition: 0.15s;
    }

    .close-btn:hover {
      color: #c44506;
    }

    /* Order summary */
    #orderSummary {
      margin-bottom: 22px;
      background: #fdf8f4;
      padding: 16px 18px;
      border-radius: 20px;
      border-left: 6px solid #b85e1a;
    }

    #orderSummary h4 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #2c1d12;
      margin-bottom: 4px;
    }

    #orderSummary p {
      font-weight: 800;
      color: #b85e1a;
      font-size: 1.3rem;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      color: #5f4b3a;
      letter-spacing: 0.2px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #e2d8d0;
      border-radius: 18px;
      font-family: inherit;
      font-size: 0.95rem;
      background: #fefcfb;
      transition: 0.2s;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #b85e1a;
      outline: none;
      box-shadow: 0 0 0 4px rgba(184, 94, 26, 0.1);
      background: #ffffff;
    }

    /* Payment Options */
    .payment-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 22px;
    }

    .pay-label {
      display: flex;
      align-items: center;
      padding: 15px 18px;
      border: 1.5px solid #ede6de;
      border-radius: 18px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      background: #fefcfb;
      transition: 0.15s;
    }

    .pay-label:hover {
      background: #fdf8f4;
      border-color: #dbbd9c;
    }

    .pay-label input {
      margin-right: 14px;
      width: 20px;
      height: 20px;
      accent-color: #b85e1a;
      cursor: pointer;
    }

    /* QR section */
    .qr-section {
      display: none;
      text-align: center;
      margin: 16px 0 22px;
      padding: 20px;
      background: #fdf8f4;
      border-radius: 22px;
      border: 1px dashed #dbbd9c;
    }

    .qr-section p:first-child {
      font-weight: 700;
      color: #2c1d12;
      margin-bottom: 12px;
      font-size: 0.95rem;
    }

    .qr-section img {
      width: 160px;
      height: 160px;
      border-radius: 16px;
      margin-bottom: 10px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.05);
      background: white;
      padding: 6px;
    }

    .qr-section p:last-child {
      font-size: 0.75rem;
      color: #9b8878;
      font-weight: 500;
    }

    .place-order-btn {
      width: 100%;
      background: #1e7b3c;
      color: white;
      padding: 18px;
      border: none;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 8px 20px rgba(30, 123, 60, 0.25);
    }

    .place-order-btn:hover {
      background: #14612d;
      box-shadow: 0 10px 28px rgba(30, 123, 60, 0.35);
    }

    .footer {
      text-align: center;
      padding: 32px 20px 20px;
      color: #9b8878;
      font-size: 0.85rem;
      font-weight: 500;
      border-top: 1px solid #e8ddd4;
      margin-top: 30px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .footer span {
      color: #c44506;
      font-weight: 700;
    }

    /* Time slot indicator */
    .time-slot-badge {
      display: inline-block;
      background: #fdf2e8;
      color: #8b4513;
      font-weight: 600;
      font-size: 0.7rem;
      padding: 4px 12px;
      border-radius: 40px;
      margin-left: 12px;
      letter-spacing: 0.3px;
      border: 1px solid #f0d9c6;
    }

    /* responsive */
    @media (max-width: 500px) {
      .brand h1 {
        font-size: 1.8rem;
      }
      .menu-container {
        padding: 14px;
        gap: 18px;
      }
      .card-img-container {
        height: 160px;
      }
    }
  </style>
</head>
<body>

<!-- HEADER with big BK MART -->
<div class="header">
  <div class="brand">
    <h1>BK MART</h1>
    <p>🍛 Biryani House · <i>★★★★★</i> 4.5</p>
  </div>
  <div class="time-slot-badge" id="liveTimeSlot">🍽️ Loading...</div>
</div>

<!-- SEARCH -->
<div class="search-container">
  <div class="search-box">
    <span>🔍</span>
    <input type="text" id="searchInput" placeholder="Search Biryani, Taheri, Idli, Dosa...">
  </div>
</div>

<!-- SHOP CLOSED ALERT -->
<div id="shopAlert" class="alert-closed">⚠️ Aaj Dukan Band Hai (Shop Closed for Holiday)</div>

<!-- MENU GRID -->
<div class="menu-container" id="menuGrid"></div>

<div class="footer">
  Made with <span>❤️</span> by BK MART · Fresh &amp; Premium
</div>

<!-- CHECKOUT MODAL -->
<div class="modal" id="checkoutModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Checkout</h2>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>

    <div id="orderSummary">
      <!-- dynamic order summary -->
    </div>

    <form id="checkoutForm" onsubmit="placeOrder(event)">
      <div class="form-group">
        <label>Your Name</label>
        <input type="text" id="custName" required placeholder="Full name">
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="custPhone" required placeholder="10-digit mobile">
      </div>
      <div class="form-group">
        <label>Delivery Address</label>
        <textarea id="custAddress" required rows="2" placeholder="House / street / area"></textarea>
      </div>

      <label style="font-weight: 700; margin-bottom: 10px; display: block; color: #2c1d12; font-size: 0.95rem;">Payment Method</label>
      <div class="payment-options">
        <label class="pay-label">
          <input type="radio" name="payment" value="UPI" onclick="toggleQR(true)" checked>
          📱 UPI (GPay / PhonePe / Paytm)
        </label>
        <label class="pay-label">
          <input type="radio" name="payment" value="COD" onclick="toggleQR(false)">
          💵 Cash on Delivery
        </label>
      </div>

      <!-- UPI QR (premium) -->
      <div class="qr-section" id="qrSection">
        <p>Scan &amp; Pay with any UPI app</p>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=upi://pay?pa=bkmart@okaxis&pn=BK%20MART&cu=INR" alt="BK MART UPI QR">
        <p>bkmart@okaxis · Secure payment</p>
      </div>

      <button type="submit" class="place-order-btn">Place Order · Pay Now</button>
    </form>
  </div>
</div>

<script>
  // ------------------------------------------------------------
  // 1. TIME-BASED MENU DATA (dynamic)
  // ------------------------------------------------------------
  // We'll generate a menu based on current time.
  // For demo, we'll keep it realistic but will also fallback to full menu if needed.
  // To show all items and time filtering, we'll create a master menu and filter by time.
  // BUT the user explicitly wants time slots: 6-9 idli/dosa/wada, 9-12 tahari,
  // 12-6 biryani, 6-12 shami parata, egg dosa, sada dosa.
  // We'll generate the menu according to current time, with shopStatus from data.json if present.

  // However, we also want the admin panel to work. The original approach used data.json.
  // For this premium version, we'll still fetch data.json (if exists) but ALSO respect time.
  // Actually, the user wants the menu to change by time. But admin can override with data.json.
  // We'll make data.json optional: if available, use it; else fallback to time-based.

  // Best: we fetch data.json, if it has menu, use it. But to satisfy the "time-based" requirement,
  // we'll ALSO add a time-based filter that shows only relevant items. 
  // BUT admin might add items. We'll keep admin's menu but also add a time slot tag.
  // Actually simpler: we generate menu based on time if data.json fails, but we want the admin panel to work.
  // The admin panel already manages data.json. So we'll use data.json if present.
  // BUT the user wants specific time-based items. Let's ENHANCE data.json with a "time" property.
  // For this demo, we'll just simulate by showing all items but add a time-slot badge.
  // To fully satisfy, we'll dynamically build menu from time if data.json doesn't exist.
  // I'll implement: fetch data.json, if fail or empty, use timeBasedMenu.
  // Also, if data.json has menu, we filter by current time? Not required, but we'll show all.
  // We'll also display "Live time slot" badge.

  // Actually, let's make it robust: 
  // - Check current hour (0-23).
  // - Define time-based menu segments.
  // - Fetch data.json; if exists and has menu, use it (admin override). But we'll also show time slot.
  // - If not, build menu from time.

  // Let's define the master time menu:
  const masterMenu = [
    // 6am - 9am
    { name: "Idli (2 pcs)", price: 40, image: "https://images.unsplash.com/photo-1589301760014-d929f3979dbc?q=80&w=600&auto=format&fit=crop", slot: "morning" },
    { name: "Plain Dosa", price: 60, image: "https://images.unsplash.com/photo-1630383249896-424e482df921?q=80&w=600&auto=format&fit=crop", slot: "morning" },
    { name: "Masala Dosa", price: 80, image: "https://images.unsplash.com/photo-1668236543090-82eba5ee5976?q=80&w=600&auto=format&fit=crop", slot: "morning" },
    { name: "Medu Vada (2 pcs)", price: 50, image: "https://images.unsplash.com/photo-1626509653291-18d9a934b9db?q=80&w=600&auto=format&fit=crop", slot: "morning" },
    { name: "Egg Dosa", price: 90, image: "https://images.unsplash.com/photo-1551218808-94e220e084d2?q=80&w=600&auto=format&fit=crop", slot: "morning" },
    // 9am - 12pm
    { name: "Taheri (Veg)", price: 120, image: "https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?q=80&w=600&auto=format&fit=crop", slot: "midmorning" },
    { name: "Taheri (Chicken)", price: 180, image: "https://images.unsplash.com/photo-1589302168068-964664d93dc0?q=80&w=600&auto=format&fit=crop", slot: "midmorning" },
    // 12pm - 6pm
    { name: "Hyderabadi Chicken Biryani", price: 220, image: "https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?q=80&w=600&auto=format&fit=crop", slot: "afternoon" },
    { name: "Mutton Biryani", price: 320, image: "https://images.unsplash.com/photo-1589302168068-964664d93dc0?q=80&w=600&auto=format&fit=crop", slot: "afternoon" },
    { name: "Veg Biryani", price: 160, image: "https://images.unsplash.com/photo-1596797038530-2c107229654b?q=80&w=600&auto=format&fit=crop", slot: "afternoon" },
    // 6pm - 12am
    { name: "Shami Parata (2 pcs)", price: 90, image: "https://images.unsplash.com/photo-1626074353765-517a681e40be?q=80&w=600&auto=format&fit=crop", slot: "evening" },
    { name: "Egg Dosa (evening)", price: 90, image: "https://images.unsplash.com/photo-1551218808-94e220e084d2?q=80&w=600&auto=format&fit=crop", slot: "evening" },
    { name: "Sada Dosa", price: 60, image: "https://images.unsplash.com/photo-1630383249896-424e482df921?q=80&w=600&auto=format&fit=crop", slot: "evening" },
  ];

  // Helper to get current slot
  function getCurrentSlot() {
    const hour = new Date().getHours();
    if (hour >= 6 && hour < 9) return "morning";
    if (hour >= 9 && hour < 12) return "midmorning";
    if (hour >= 12 && hour < 18) return "afternoon";
    if (hour >= 18 && hour < 24) return "evening";
    // 0-6 (midnight to 6am) -> show evening leftovers? or closed? We'll show all but label.
    return "late"; // fallback
  }

  function getSlotLabel(slot) {
    const map = {
      morning: "🌅 6am – 9am · Idli, Dosa, Vada",
      midmorning: "☀️ 9am – 12pm · Taheri",
      afternoon: "🌞 12pm – 6pm · Biryani",
      evening: "🌙 6pm – 12am · Shami Parata & Dosa",
      late: "🌃 Late night · Limited menu"
    };
    return map[slot] || "🍽️ Menu";
  }

  // ----- GLOBAL STATE -----
  let currentItem = null;
  const WHATSAPP_NUMBER = "919876543210"; // change to actual
  let shopOpen = true;
  let allMenuItems = []; // fetched or fallback

  // UI elements
  const menuGrid = document.getElementById("menuGrid");
  const shopAlert = document.getElementById("shopAlert");
  const liveTimeSlot = document.getElementById("liveTimeSlot");
  const searchInput = document.getElementById("searchInput");

  // Update time slot badge on load & every minute
  function updateTimeBadge() {
    const slot = getCurrentSlot();
    liveTimeSlot.textContent = getSlotLabel(slot);
  }
  updateTimeBadge();
  setInterval(updateTimeBadge, 60000);

  // ------------------------------------------------------------
  // 2. RENDER MENU (with search & filter by slot)
  // ------------------------------------------------------------
  function renderMenu(items, filterSlot = null) {
    const grid = document.getElementById("menuGrid");
    grid.innerHTML = "";

    let filteredItems = items;
    // If we want to filter by current slot (time-based menu), uncomment below.
    // But we also want to show all items for admin? Better to show all but highlight.
    // I'll filter to current slot for a true time-based experience.
    // However, user might want to see all items. We'll add a toggle? 
    // For now, show only items matching current slot, but if empty show all with note.
    const currentSlot = getCurrentSlot();
    // If there are items matching current slot, show them; else show all.
    const slotFiltered = items.filter(item => item.slot === currentSlot);
    if (slotFiltered.length > 0) {
      filteredItems = slotFiltered;
    } else {
      // fallback: show all items, but add a note in UI
      filteredItems = items;
    }

    // Apply search filter
    const query = searchInput.value.trim().toLowerCase();
    if (query) {
      filteredItems = filteredItems.filter(item => item.name.toLowerCase().includes(query));
    }

    if (!filteredItems || filteredItems.length === 0) {
      grid.innerHTML = "<p style='text-align:center;grid-column:1/-1;padding:40px 20px;color:#9b8878;font-weight:500;'>No items available for this time slot. Please check back later.</p>";
      return;
    }

    filteredItems.forEach((item) => {
      const div = document.createElement("div");
      div.className = "card";
      const imgSrc = item.image || "https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?q=80&w=600&auto=format&fit=crop";
      const rating = (Math.random() * (4.8 - 3.9) + 3.9).toFixed(1);

      div.innerHTML = `
        <div class="card-img-container">
          <img src="${imgSrc}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/280x180?text=No+Image'">
          <div class="rating-badge">★ ${rating}</div>
        </div>
        <div class="card-content">
          <h3 class="card-title">${item.name}</h3>
          <p class="card-price">${item.price}</p>
          <button class="buy-btn" onclick="openCheckout('${item.name.replace(/'/g, "\\'")}', ${item.price})">BUY NOW</button>
        </div>
      `;
      grid.appendChild(div);
    });
  }

  // ------------------------------------------------------------
  // 3. FETCH DATA (admin override) OR fallback to time-based menu
  // ------------------------------------------------------------
  async function loadMenu() {
    try {
      const response = await fetch('data.json?v=' + new Date().getTime());
      if (response.ok) {
        const data = await response.json();
        // shopStatus
        if (data.shopStatus === "closed") {
          shopOpen = false;
          shopAlert.style.display = "block";
        } else {
          shopOpen = true;
          shopAlert.style.display = "none";
        }
        // menu
        if (data.menu && data.menu.length > 0) {
          // Use admin menu, but we need to assign slots if missing.
          // We'll assign a slot based on time? For demo, keep as is.
          allMenuItems = data.menu.map(item => ({
            ...item,
            slot: item.slot || "all"  // no slot means always visible
          }));
        } else {
          allMenuItems = masterMenu;
        }
      } else {
        // 404: no data.json, use masterMenu
        allMenuItems = masterMenu;
        shopOpen = true;
        shopAlert.style.display = "none";
      }
    } catch (error) {
      console.warn("Using time-based menu fallback.");
      allMenuItems = masterMenu;
      shopOpen = true;
      shopAlert.style.display = "none";
    }
    // Render with time filter
    applyAndRender();
  }

  function applyAndRender() {
    // If shop is closed, maybe we still show menu but disable? 
    // We'll still show menu but alert is visible.
    // Also update time badge.
    updateTimeBadge();
    // Filter by time internally in renderMenu
    renderMenu(allMenuItems);
  }

  // Search listener
  searchInput.addEventListener("input", () => {
    renderMenu(allMenuItems);
  });

  // ------------------------------------------------------------
  // 4. MODAL / CHECKOUT LOGIC
  // ------------------------------------------------------------
  window.openCheckout = function(name, price) {
    if (!shopOpen) {
      alert("Shop is closed today. Please order another day.");
      return;
    }
    currentItem = { name, price };
    document.getElementById("orderSummary").innerHTML = `
      <h4>${name}</h4>
      <p>₹${price}</p>
    `;
    document.getElementById("checkoutModal").classList.add("active");
  };

  window.closeModal = function() {
    document.getElementById("checkoutModal").classList.remove("active");
    document.getElementById("checkoutForm").reset();
    toggleQR(true); // reset to UPI
  };

  window.toggleQR = function(show) {
    document.getElementById("qrSection").style.display = show ? "block" : "none";
  };

  window.placeOrder = function(event) {
    event.preventDefault();

    const name = document.getElementById("custName").value;
    const phone = document.getElementById("custPhone").value;
    const address = document.getElementById("custAddress").value;
    const paymentMethod = document.querySelector('input[name="payment"]:checked').value;

    // WhatsApp message format
    let message = `*New Order - BK MART*%0A%0A`;
    message += `*Item:* ${currentItem.name}%0A`;
    message += `*Price:* ₹${currentItem.price}%0A`;
    message += `*Payment:* ${paymentMethod}%0A%0A`;
    message += `*Customer Details:*%0A`;
    message += `Name: ${name}%0A`;
    message += `Phone: ${phone}%0A`;
    message += `Address: ${address}`;

    // Open WhatsApp
    const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;
    window.open(whatsappUrl, '_blank');

    alert("Order placed successfully! WhatsApp par details bhej di gayi hain.");
    closeModal();
  };

  // ------------------------------------------------------------
  // 5. INIT
  // ------------------------------------------------------------
  loadMenu();
  // Add time slot refresh every minute to update menu visibility
  setInterval(() => {
    updateTimeBadge();
    // re-render to reflect time change
    if (allMenuItems.length > 0) renderMenu(allMenuItems);
  }, 60000);

</script>
</body>
</html>
