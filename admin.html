<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BK MART | Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--dark:#21170f;--gold:#c79551;--bg:#f7f3ec;--line:#e9dfd2;--green:#23834f;--red:#bd4545}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:'DM Sans',sans-serif;color:#271f18}.top{background:var(--dark);color:#fff;padding:23px max(18px,calc((100% - 1100px)/2));display:flex;justify-content:space-between;align-items:center}.top h1{font:800 27px 'Playfair Display';margin:0}.top span{color:#e4bd80}.wrap{max-width:1100px;margin:22px auto;padding:0 16px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.tabs button,.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.tabs button{background:white;color:#695b4c}.tabs button.active,.btn{background:var(--dark);color:white}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:19px;margin-bottom:15px;box-shadow:0 8px 24px #27180a08}.panel h2{font:800 21px 'Playfair Display';margin:0 0 15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:12px;font-weight:800;margin:7px 0 5px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit;background:#fff}.btn{margin-top:10px}.btn.secondary{background:#f3ede4;color:#453629}.btn.danger{background:#fff0ef;color:var(--red)}.hotel,.item,.order{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.line{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.muted{font-size:12px;color:#8a7c6d}.hidden{display:none!important}.variant-row{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;margin:6px 0}.badge{font-size:11px;background:#f7f0e5;padding:5px 9px;border-radius:20px}.order h3{margin:0 0 6px}.login{max-width:420px;margin:10vh auto}.status{padding:7px 10px;border-radius:20px;font-size:12px;background:#eaf7ef;color:var(--green)}@media(max-width:600px){.grid{grid-template-columns:1fr}.top h1{font-size:23px}.variant-row{grid-template-columns:1fr 1fr}.variant-row button{grid-column:1/-1}}
</style></head><body>
<header class="top"><h1>BK <span>MART</span> · Admin</h1><button id="logoutBtn" class="btn secondary hidden" onclick="logout()">Logout</button></header>
<main class="wrap">
<section id="loginPanel" class="panel login"><h2>Admin sign in</h2><p class="muted">Use the admin password configured on your server.</p><div class="field"><label>Admin password</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" style="width:100%" onclick="login()">Sign in</button><p id="loginError" class="muted"></p></section>
<section id="app" class="hidden">
<div class="tabs"><button class="active" onclick="tab('hotels',this)">🏨 Hotels & Menu</button><button onclick="tab('orders',this)">📦 Orders & Tokens</button><button onclick="tab('settings',this)">⚙️ Store settings</button></div>
<div id="hotelsPane">
<div class="panel"><h2>Add a hotel / restaurant</h2><div class="grid"><div class="field"><label>Hotel name</label><input id="newHotelName" placeholder="e.g. Biryani House"></div><div class="field"><label>Photo URL</label><input id="newHotelImage" placeholder="https://..."></div><div class="field" style="grid-column:1/-1"><label>Description</label><input id="newHotelDesc" placeholder="Speciality / short description"></div></div><button class="btn" onclick="addHotel()">+ Add hotel</button></div>
<div class="panel"><h2>Manage hotels and their separate menus</h2><div id="hotelList"></div></div>
</div>
<div id="ordersPane" class="hidden"><div class="panel"><div class="line"><h2>Live orders & real tokens</h2><button class="btn secondary" onclick="loadOrders()">Refresh</button></div><div class="muted">Token is generated and stored by the server. Update each order status here.</div><div id="ordersList"></div></div></div>
<div id="settingsPane" class="hidden"><div class="panel"><h2>Store settings</h2><label class="line"><b>Accepting orders</b><input id="storeOpen" type="checkbox" style="width:22px;height:22px"></label><button class="btn" onclick="saveSettings()">Save settings</button></div></div>
</section></main>
<script>
const API='api/index.php';let hotels=[],orders=[];
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action,opts={}){const r=await fetch(`${API}?action=${action}`,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const d=await r.json();if(!r.ok||d.success===false)throw Error(d.message||'Request failed');return d}
async function login(){try{await api('login',{method:'POST',body:JSON.stringify({password:$('password').value})});showApp()}catch(e){$('loginError').textContent=e.message}}
async function check(){try{await api('session');showApp()}catch(e){}}
function showApp(){$('loginPanel').classList.add('hidden');$('app').classList.remove('hidden');$('logoutBtn').classList.remove('hidden');loadHotels();loadOrders();loadSettings()}
async function logout(){await api('logout',{method:'POST'});location.reload()}
function tab(name,el){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));el.classList.add('active');['hotels','orders','settings'].forEach(x=>$(`${x}Pane`).classList.toggle('hidden',x!==name));if(name==='orders')loadOrders()}
async function loadHotels(){const d=await api('admin_hotels');hotels=d.hotels||[];renderHotels()}
function renderHotels(){$('hotelList').innerHTML=hotels.map(h=>`<div class="hotel"><div class="line"><div><b>${esc(h.name)}</b> <span class="badge">${h.is_open?'Open':'Closed'}</span><div class="muted">${esc(h.description||'')}</div></div><button class="btn danger" onclick="deleteHotel(${h.id})">Delete hotel</button></div><div class="grid"><div class="field"><label>Hotel name</label><input id="hn${h.id}" value="${esc(h.name)}"></div><div class="field"><label>Photo URL</label><input id="hi${h.id}" value="${esc(h.image||'')}"></div><div class="field"><label>Description</label><input id="hd${h.id}" value="${esc(h.description||'')}"></div><div class="field"><label>Availability</label><select id="ho${h.id}"><option value="1" ${h.is_open?'selected':''}>Open</option><option value="0" ${!h.is_open?'selected':''}>Closed</option></select></div></div><button class="btn secondary" onclick="saveHotel(${h.id})">Save hotel details</button><hr style="border:0;border-top:1px solid #eee;margin:18px 0"><h3>Menu items</h3><div>${(h.items||[]).map(i=>itemEditor(h.id,i)).join('')||'<p class="muted">No menu items yet.</p>'}</div><div class="panel" style="background:#faf7f1"><b>Add item to ${esc(h.name)}</b><div class="grid"><div class="field"><label>Item name</label><input id="in${h.id}" placeholder="Chicken biryani"></div><div class="field"><label>Photo URL</label><input id="ii${h.id}" placeholder="https://..."></div><div class="field" style="grid-column:1/-1"><label>Description</label><input id="id${h.id}" placeholder="Short description"></div></div><button class="btn" onclick="addItem(${h.id})">+ Add menu item</button></div></div>`).join('')||'<p class="muted">No hotels yet. Add your first hotel above.</p>'}
function itemEditor(hid,i){const vs=i.variants||[{label:'Regular',price:i.price||0}];return `<div class="item"><div class="line"><b>${esc(i.name)}</b><button class="btn danger" onclick="deleteItem(${hid},${i.id})">Delete item</button></div><div class="grid"><div class="field"><label>Name</label><input id="nm${i.id}" value="${esc(i.name)}"></div><div class="field"><label>Image URL</label><input id="im${i.id}" value="${esc(i.image||'')}"></div><div class="field" style="grid-column:1/-1"><label>Description</label><input id="ds${i.id}" value="${esc(i.description||'')}"></div></div><label class="line"><b>Available for ordering</b><input id="av${i.id}" type="checkbox" ${i.available?'checked':''} style="width:20px;height:20px"></label><label><b>Price options (e.g. Half / Full)</b></label><div id="vars${i.id}">${vs.map((v,n)=>variantRow(i.id,n,v)).join('')}</div><button class="btn secondary" onclick="addVariant(${i.id})">+ Add price option</button> <button class="btn" onclick="saveItem(${hid},${i.id})">Save item</button></div>`}
function variantRow(id,n,v){return `<div class="variant-row"><input placeholder="Size / variant" data-vlabel="${id}" value="${esc(v.label)}"><input type="number" min="1" data-vprice="${id}" value="${Number(v.price)}"><button class="btn danger" onclick="this.parentElement.remove()">×</button></div>`}
function addVariant(id){const box=$(`vars${id}`);box.insertAdjacentHTML('beforeend',variantRow(id,box.children.length,{label:'',price:0}))}
async function addHotel(){try{await api('hotel_add',{method:'POST',body:JSON.stringify({name:$('newHotelName').value.trim(),image:$('newHotelImage').value.trim(),description:$('newHotelDesc').value.trim()})});$('newHotelName').value=$('newHotelImage').value=$('newHotelDesc').value='';await loadHotels()}catch(e){alert(e.message)}}
async function saveHotel(id){try{await api('hotel_update',{method:'POST',body:JSON.stringify({id,name:$(`hn${id}`).value,image:$(`hi${id}`).value,description:$(`hd${id}`).value,is_open:$(`ho${id}`).value==='1'})});await loadHotels()}catch(e){alert(e.message)}}
async function deleteHotel(id){if(!confirm('Delete this hotel and its menu?'))return;try{await api('hotel_delete',{method:'POST',body:JSON.stringify({id})});await loadHotels()}catch(e){alert(e.message)}}
async function addItem(hid){try{await api('item_add',{method:'POST',body:JSON.stringify({hotel_id:hid,name:$(`in${hid}`).value.trim(),image:$(`ii${hid}`).value.trim(),description:$(`id${hid}`).value.trim(),variants:[{label:'Regular',price:0}]})});await loadHotels()}catch(e){alert(e.message)}}
function readVariants(id){return [...document.querySelectorAll(`[data-vlabel="${id}"]`)].map((x,n)=>({label:x.value.trim(),price:Number(document.querySelectorAll(`[data-vprice="${id}"]`)[n].value)}))}
async function saveItem(hid,id){try{const variants=readVariants(id);if(!variants.length||variants.some(v=>!v.label||!Number.isFinite(v.price)||v.price<=0))throw Error('Har price option ka naam aur valid price daalein.');await api('item_update',{method:'POST',body:JSON.stringify({id,hotel_id:hid,name:$(`nm${id}`).value,image:$(`im${id}`).value,description:$(`ds${id}`).value,available:$(`av${id}`).checked,variants})});await loadHotels()}catch(e){alert(e.message)}}
async function deleteItem(hid,id){if(!confirm('Delete this menu item?'))return;try{await api('item_delete',{method:'POST',body:JSON.stringify({id,hotel_id:hid})});await loadHotels()}catch(e){alert(e.message)}}
async function loadOrders(){try{const d=await api('orders');orders=d.orders||[];renderOrders()}catch(e){$('ordersList').textContent=e.message}}
function renderOrders(){$('ordersList').innerHTML=orders.map(o=>`<div class="order"><div class="line"><h3>${esc(o.token)} · ${esc(o.hotel_name)}</h3><span class="badge">${esc(o.status)}</span></div><b>${esc(o.item_name)} (${esc(o.variant)}) × ${o.quantity} — ₹${o.total}</b><p class="muted">${esc(o.customer_name)} · ${esc(o.phone)}<br>${esc(o.address)}<br>${new Date(o.created_at.replace(' ','T')+'Z').toLocaleString()}</p><div class="line"><span class="badge">${esc(o.payment)}</span><select id="st${o.id}" style="max-width:190px;padding:9px;border:1px solid #ddd;border-radius:10px"><option ${o.status==='received'?'selected':''}>received</option><option ${o.status==='preparing'?'selected':''}>preparing</option><option ${o.status==='ready'?'selected':''}>ready</option><option ${o.status==='completed'?'selected':''}>completed</option><option ${o.status==='cancelled'?'selected':''}>cancelled</option></select><button class="btn" onclick="updateStatus(${o.id})">Update status</button></div></div>`).join('')||'<p class="muted">No orders received yet.</p>'}
async function updateStatus(id){try{await api('order_status',{method:'POST',body:JSON.stringify({id,status:$(`st${id}`).value})});await loadOrders()}catch(e){alert(e.message)}}
async function loadSettings(){try{const d=await api('settings');$('storeOpen').checked=d.shop_status!=='closed'}catch(e){}}
async function saveSettings(){try{await api('settings_update',{method:'POST',body:JSON.stringify({shop_status:$('storeOpen').checked?'open':'closed'})});alert('Settings saved')}catch(e){alert(e.message)}}
check();
</script></body></html>
