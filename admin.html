<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - BK MART</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
  body { background:#f4f4f4; padding:20px; }
  .container { max-width:600px; margin:0 auto; background:white; padding:20px; border-radius:12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  h1 { text-align:center; margin-bottom:20px; color:#5a2e12; }
  
  .section-box { margin-bottom:20px; padding-bottom:20px; border-bottom: 1px solid #eee; }
  .section-box h3 { font-size: 16px; margin-bottom:10px; color:#333; }
  
  input, select { width:100%; padding:12px; margin-bottom:10px; border:1px solid #ccc; border-radius:8px; font-size:15px; outline:none; }
  input:focus, select:focus { border-color: #5a2e12; }

  .item-card { background:#fafafa; padding:15px; border-radius:8px; margin-bottom:15px; border:1px solid #eee; }
  .item-card h4 { margin-bottom:10px; color:#5a2e12; font-size:16px; }
  
  .add-btn { display:block; width:100%; padding:15px; font-size:16px; background:#5a2e12; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold; }
  .add-btn:hover { background:#43210c; }
  
  .delete-btn { background:#dc3545; color:white; border:none; padding:8px 12px; border-radius:5px; cursor:pointer; width:100%; margin-top:5px;}
  
  /* Notification Toast */
  #toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 1; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 17px; }
  #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
  @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
  @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
</style>
</head>
<body>
<div class="container">
  <h1>Admin Panel</h1>
  
  <div class="section-box">
    <h3>GitHub Token (Private)</h3>
    <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxxxxxx" onchange="saveTokenAndLoad()">
  </div>

  <div class="section-box">
    <h3>Shop Status</h3>
    <select id="shopStatus" onchange="saveData()">
      <option value="open">🟢 Shop Open</option>
      <option value="closed">🔴 Shop Closed (Today is holiday)</option>
    </select>
  </div>

  <div id="itemsContainer"></div>

  <button class="add-btn" onclick="addNewItem()">➕ Naya Item Add Karein</button>
</div>

<div id="toast">Data Saved Successfully!</div>

<script>
const GITHUB_OWNER = "Shaikmuzammil22";
const GITHUB_REPO = "BK-MART";
const DATA_FILE = "data.json";

let currentData = { shopStatus: "open", menu: [] };
let fileSha = null;

// Page load hone par token check karein
window.onload = function() {
  const savedToken = localStorage.getItem('github_pat');
  if (savedToken) {
    document.getElementById('githubToken').value = savedToken;
    loadDataFromGitHub();
  }
};

function showToast(msg) {
  const toast = document.getElementById("toast");
  toast.innerText = msg;
  toast.className = "show";
  setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
}

function saveTokenAndLoad() {
  const token = document.getElementById('githubToken').value.trim();
  if(token) {
    localStorage.setItem('github_pat', token);
    loadDataFromGitHub();
  }
}

function getToken() {
  return document.getElementById('githubToken').value.trim();
}

// GitHub se data load karein
async function loadDataFromGitHub() {
  const token = getToken();
  if (!token) return;

  try {
    const response = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_FILE}`, {
      headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' }
    });
    
    if (response.ok) {
      const fileData = await response.json();
      fileSha = fileData.sha;
      const decodedContent = atob(fileData.content);
      currentData = JSON.parse(decodedContent);
      
      // Agar shopStatus nahi hai purani file mein, toh default open set karein
      if (!currentData.shopStatus) currentData.shopStatus = "open";
      
      renderUI();
    } else if (response.status === 404) {
      currentData = { shopStatus: "open", menu: [] };
      fileSha = null;
      renderUI();
    }
  } catch (error) {
    console.error(error);
    alert("Error loading data: " + error.message);
  }
}

function renderUI() {
  // Shop Status set karein
  document.getElementById('shopStatus').value = currentData.shopStatus || "open";

  // Menu render karein
  const container = document.getElementById('itemsContainer');
  container.innerHTML = "";

  if (!currentData.menu || currentData.menu.length === 0) {
    container.innerHTML = "<p style='text-align:center; margin-bottom:20px;'>Abhi koi item nahi hai. Neeche se add karein.</p>";
    return;
  }

  currentData.menu.forEach((item, index) => {
    const card = document.createElement("div");
    card.className = "item-card";
    card.innerHTML = `
      <h4>Item ${index + 1}</h4>
      <label>Item Name</label>
      <input type="text" value="${item.name}" onchange="updateItem(${index}, 'name', this.value)">
      
      <label>Price (₹)</label>
      <input type="number" value="${item.price}" onchange="updateItem(${index}, 'price', this.value)">
      
      <label>Photo URL (GitHub ka link)</label>
      <input type="text" value="${item.image || ''}" placeholder="https://raw.githubusercontent.com/..." onchange="updateItem(${index}, 'image', this.value)">
      
      <button class="delete-btn" onclick="deleteItem(${index})">Delete Item</button>
    `;
    container.appendChild(card);
  });
}

function updateItem(index, field, value) {
  if (field === 'price') value = Number(value);
  currentData.menu[index][field] = value;
}

function addNewItem() {
  currentData.menu.push({ name: "Naya Item", price: 0, image: "" });
  renderUI();
}

function deleteItem(index) {
  if(confirm("Pakka delete karna hai?")) {
    currentData.menu.splice(index, 1);
    renderUI();
  }
}

// Data save karne ka main function
async function saveData() {
  const token = getToken();
  if (!token) {
    alert("Pehle GitHub Token daalein!");
    return;
  }

  // Status update karein
  currentData.shopStatus = document.getElementById('shopStatus').value;

  const contentString = JSON.stringify(currentData, null, 2);
  const encodedContent = btoa(unescape(encodeURIComponent(contentString)));

  const body = { message: "Admin: Data updated", content: encodedContent };
  if (fileSha) body.sha = fileSha;

  try {
    const response = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_FILE}`, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (response.ok) {
      const result = await response.json();
      fileSha = result.content.sha; 
      showToast("Data GitHub par save ho gaya!");
    } else {
      const err = await response.json();
      alert("Save nahi hua: " + err.message);
    }
  } catch (error) {
    alert("Network error: " + error.message);
  }
}
</script>
</body>
</html>
