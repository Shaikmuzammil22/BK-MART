<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - BK MART</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
  body { background:#f4f4f4; padding:20px; }
  h1 { text-align:center; margin-bottom:20px; color:#333; }
  .container { max-width:800px; margin:0 auto; }
  .token-box {
    background:#fff3cd; padding:15px; border-radius:8px; margin-bottom:20px;
    border: 1px solid #ffeeba;
  }
  .token-box input { width:100%; padding:10px; margin-top:5px; border:1px solid #ccc; border-radius:5px; }
  .add-btn {
    display:block; width:100%; padding:15px; font-size:18px;
    background:#28a745; color:white; border:none; border-radius:8px;
    cursor:pointer; margin-bottom:20px; font-weight:bold;
  }
  .add-btn:hover { background:#218838; }
  .item-card {
    background:white; padding:15px; border-radius:8px;
    margin-bottom:15px; display:flex; gap:15px; align-items:center;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
  }
  .item-card img {
    width:80px; height:80px; object-fit:cover; border-radius:8px;
    background:#ddd;
  }
  .item-info { flex:1; }
  .item-info h3 { margin-bottom:5px; }
  .item-info p { color:#666; }
  .delete-btn {
    background:#dc3545; color:white; border:none; padding:8px 12px;
    border-radius:5px; cursor:pointer;
  }
  .delete-btn:hover { background:#c82333; }

  .modal {
    display:none; position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.6); justify-content:center; align-items:center;
    z-index:1000;
  }
  .modal.active { display:flex; }
  .modal-content {
    background:white; padding:25px; border-radius:10px; width:90%;
    max-width:400px;
  }
  .modal-content h2 { margin-bottom:15px; }
  .modal-content input {
    width:100%; padding:10px; margin-bottom:12px; border:1px solid #ccc;
    border-radius:5px; font-size:15px;
  }
  .modal-content input[type="file"] { border:none; padding:5px 0; }
  .modal-btns { display:flex; gap:10px; }
  .modal-btns button {
    flex:1; padding:12px; border:none; border-radius:5px; cursor:pointer;
    font-size:15px; font-weight:bold;
  }
  .save-btn { background:#28a745; color:white; }
  .save-btn:hover { background:#218838; }
  .cancel-btn { background:#6c757d; color:white; }
  .cancel-btn:hover { background:#5a6268; }
  #preview { width:100px; height:100px; object-fit:cover; border-radius:8px; margin-bottom:10px; display:none; }
</style>
</head>
<body>
<div class="container">
  <h1>🍛 Admin Panel - BK MART</h1>
  
  <div class="token-box">
    <label><strong>GitHub Token (PAT)</strong></label>
    <input type="password" id="githubToken" placeholder="ghp_... yahan apna token daalein">
    <small>Yeh token sirf aapke browser mein save hoga.</small>
  </div>

  <button class="add-btn" onclick="openModal()">➕ Naya Item Add Karein</button>
  <div id="menuList"></div>
</div>

<div class="modal" id="itemModal">
  <div class="modal-content">
    <h2>Naya Item</h2>
    <input type="text" id="itemName" placeholder="Item Name (e.g. Chicken Biryani)">
    <input type="number" id="itemPrice" placeholder="Price (₹)">
    <input type="file" id="itemImage" accept="image/*" onchange="previewImage(event)">
    <img id="preview">
    <div class="modal-btns">
      <button class="save-btn" onclick="saveItem()">Save to GitHub</button>
      <button class="cancel-btn" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
// Apne repo ki details yahan daalein
const GITHUB_OWNER = "Shaikmuzammil22";
const GITHUB_REPO = "BK-MART";
const DATA_FILE = "data.json";

let currentData = { menu: [] };
let editId = null;

// Page load hote hi token check karo aur data load karo
window.onload = function() {
  const savedToken = localStorage.getItem('github_pat');
  if (savedToken) document.getElementById('githubToken').value = savedToken;
  loadDataFromGitHub();
};

function getToken() {
  const token = document.getElementById('githubToken').value.trim();
  if (!token) {
    alert("Pehle GitHub Token daalein!");
    return null;
  }
  localStorage.setItem('github_pat', token);
  return token;
}

// GitHub se data.json fetch karna
async function loadDataFromGitHub() {
  const token = getToken();
  if (!token) return;

  try {
    const response = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_FILE}`, {
      headers: {
        'Authorization': `Bearer ${token}`,
        'Accept': 'application/vnd.github.v3+json'
      }
    });
    
    if (response.ok) {
      const fileData = await response.json();
      // Content base64 mein hota hai, use decode karna
      const decodedContent = atob(fileData.content);
      currentData = JSON.parse(decodedContent);
      // File ka SHA save karo (update ke liye zaroori hai)
      currentData.sha = fileData.sha; 
      renderMenu();
    } else if (response.status === 404) {
      // Agar file nahi hai to default se start karo
      currentData = { menu: [] };
      renderMenu();
    } else {
      alert("GitHub se data load nahi hua. Token aur repo check karein.");
    }
  } catch (error) {
    console.error(error);
    alert("Error: " + error.message);
  }
}

// Data ko GitHub par save karna
async function saveDataToGitHub(newMenu) {
  const token = getToken();
  if (!token) return false;

  // Menu data ko string mein badlo
  const contentString = JSON.stringify({ menu: newMenu }, null, 2);
  // Base64 mein encode karo (GitHub API ki requirement)
  const encodedContent = btoa(unescape(encodeURIComponent(contentString)));

  const body = {
    message: "Admin: Menu updated",
    content: encodedContent,
    sha: currentData.sha // Purani file ka SHA (agar hai)
  };

  try {
    const response = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_FILE}`, {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });

    if (response.ok) {
      const result = await response.json();
      // Naya SHA save karo
      currentData.sha = result.content.sha;
      currentData.menu = newMenu;
      renderMenu();
      return true;
    } else {
      const err = await response.json();
      alert("Save nahi hua: " + err.message);
      return false;
    }
  } catch (error) {
    console.error(error);
    alert("Network error: " + error.message);
    return false;
  }
}

function renderMenu() {
  const list = document.getElementById("menuList");
  list.innerHTML = "";

  if (!currentData.menu || currentData.menu.length === 0) {
    list.innerHTML = "<p style='text-align:center;'>Abhi koi item nahi hai. Add karein.</p>";
    return;
  }

  currentData.menu.forEach((item, index) => {
    const card = document.createElement("div");
    card.className = "item-card";
    card.innerHTML = `
      <img src="${item.image || 'https://via.placeholder.com/80?text=No+Image'}" alt="${item.name}">
      <div class="item-info">
        <h3>${item.name}</h3>
        <p>₹${item.price}</p>
      </div>
      <button class="delete-btn" onclick="deleteItem(${index})">Delete</button>
    `;
    list.appendChild(card);
  });
}

function openModal() {
  document.getElementById("itemModal").classList.add("active");
  document.getElementById("itemName").value = "";
  document.getElementById("itemPrice").value = "";
  document.getElementById("itemImage").value = "";
  document.getElementById("preview").style.display = "none";
}

function closeModal() {
  document.getElementById("itemModal").classList.remove("active");
}

function previewImage(event) {
  const file = event.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const preview = document.getElementById("preview");
      preview.src = e.target.result;
      preview.style.display = "block";
    };
    reader.readAsDataURL(file);
  }
}

async function saveItem() {
  const name = document.getElementById("itemName").value.trim();
  const price = document.getElementById("itemPrice").value.trim();
  const imageFile = document.getElementById("itemImage").files[0];

  if (!name || !price) {
    alert("Item name aur price dono daalna zaroori hai!");
    return;
  }

  let imageBase64 = "";
  if (imageFile) {
    // Image ko base64 mein badalna (chhoti image honi chahiye)
    imageBase64 = await new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => resolve(e.target.result);
      reader.readAsDataURL(imageFile);
    });
  }

  const newItem = { name: name, price: Number(price), image: imageBase64 };
  const newMenu = [...currentData.menu, newItem];

  const success = await saveDataToGitHub(newMenu);
  if (success) {
    closeModal();
    alert("Item GitHub par save ho gaya! Ab customer page refresh karein.");
  }
}

async function deleteItem(index) {
  if (!confirm("Pakka delete karna hai?")) return;
  
  const newMenu = currentData.menu.filter((_, i) => i !== index);
  const success = await saveDataToGitHub(newMenu);
  if (success) {
    alert("Item delete ho gaya!");
  }
}
</script>
</body>
</html>
