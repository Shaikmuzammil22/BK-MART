<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Track Order Status</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
    .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #333; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; }
    button { width: 100%; background: #111; color: #D4AF37; padding: 12px; border: none; border-radius: 5px; font-size: 1rem; font-weight: bold; margin-top: 20px; cursor: pointer; }
    button:hover { background: #333; }
    .msg { text-align: center; color: green; font-weight: bold; margin-top: 15px; }
  </style>
</head>
<body>

<div class="container">
  <h2>Update Order Status</h2>
  
  <label>Customer Phone Number (Order ID)</label>
  <input type="text" id="phone" placeholder="e.g. 9876543210">

  <label>Set Status To:</label>
  <select id="status">
    <option value="pending">🕒 Pending</option>
    <option value="arriving">🛵 Arriving (Out for delivery)</option>
    <option value="delivered">✅ Delivered</option>
  </select>

  <button onclick="updateStatus()">Update Status</button>
  <div id="msg" class="msg"></div>
</div>

<script>
  function updateStatus() {
    const phone = document.getElementById('phone').value;
    const status = document.getElementById('status').value;

    if(!phone) return alert("Phone number daalein!");

    const data = localStorage.getItem(`order_${phone}`);

    if(!data) {
      document.getElementById('msg').textContent = "❌ Order nahi mila is number par!";
      document.getElementById('msg').style.color = "red";
      return;
    }

    const order = JSON.parse(data);
    order.status = status;
    localStorage.setItem(`order_${phone}`, JSON.stringify(order));

    document.getElementById('msg').textContent = `✅ Status updated to "${status}"!`;
    document.getElementById('msg').style.color = "green";
  }
</script>
</body>
</html>
